<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Catálogo · Stock</title>
<link rel="icon" type="image/svg+xml" href="../atomostudio/img/logo-atomo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script src="verticals.js"></script>
<script src="api.js"></script>
</head>
<body data-st-page="productos">
<div class="app">
  <aside class="sidebar">
    <div class="sb-h"><img class="logo" src="../atomostudio/img/logo-atomo.svg" width="28" height="28" alt=""/><div class="sb-h-name">Stock<small>by Átomo</small></div></div>
    <div class="sb-site"><div class="sb-site-thumb st-business-thumb">—</div><div class="sb-site-meta"><div class="sb-site-name st-business-name">Mi negocio</div><div class="sb-site-url st-business-type">—</div></div></div>
    <nav class="sb-nav">
      <a href="app.html" class="sb-item"><span class="ico"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="2.5" width="5" height="5" rx="1"/><rect x="10.5" y="2.5" width="5" height="5" rx="1"/><rect x="2.5" y="10.5" width="5" height="5" rx="1"/><rect x="10.5" y="10.5" width="5" height="5" rx="1"/></svg></span>Inicio</a>
      <a href="productos.html" class="sb-item active"><span class="ico"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="12" height="10" rx="1.5"/><path d="M3 8h12"/></svg></span><span class="st-catalog-nav">Catálogo</span></a>
      <a href="scanner.html" class="sb-item"><span class="ico"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h2V4H3v2zm10 0h2V4h-2v2zM3 14h2v-2H3v2zm10 0h2v-2h-2v2z"/><rect x="6" y="7" width="6" height="4" rx="0.5"/></svg></span>Escáner</a>
      <a href="ventas.html" class="sb-item"><span class="ico"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="6.5"/><path d="M6 9h6M9 6v6"/></svg></span>Ventas</a>
      <a href="chat.html" class="sb-item"><span class="ico"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5c0-3 2.5-5.5 5.5-5.5h1c3 0 5.5 2.5 5.5 5.5v.5c0 3-2.5 5.5-5.5 5.5H7l-3 2v-2.7a5.5 5.5 0 0 1-.5-2.3v-3z"/></svg></span>Geos</a>
      <a href="configuracion.html" class="sb-item"><span class="ico"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="2.5"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2"/></svg></span>Configuración</a>
    </nav>
    <div class="sb-foot"><div class="sb-foot-avatar st-foot-avatar">—</div><div class="sb-foot-meta"><div class="sb-foot-name st-client-name">—</div><div class="sb-foot-role st-business-name">—</div></div><button type="button" class="btn btn-ghost st-logout" style="padding:6px 10px;font-size:12px;">↪</button></div>
  </aside>
  <main class="main st-page-main">
    <header class="topbar">
      <div class="top-title st-catalog-nav">Catálogo</div>
      <div class="top-actions">
        <button type="button" class="btn btn-ghost" id="st-go-scanner">📷 Escáner</button>
        <button type="button" class="btn btn-ghost" id="st-import-products">Importar CSV</button>
        <button type="button" class="btn btn-primary" id="st-add-product">+ Agregar <span class="st-product-singular">producto</span></button>
      </div>
    </header>
    <div class="content">
      <div id="st-import-feedback" style="padding:12px 16px 0; font-size:13px; color:var(--text2);"></div>
      <div class="catalog-toolbar">
        <input class="input" id="st-product-search" placeholder="Buscar por nombre o código…"/>
        <div id="st-categories"></div>
        <input type="checkbox" id="st-filter-low" class="hidden-filter"/>
      </div>
      <div class="prod-grid" id="st-product-grid"></div>
    </div>
  </main>
</div>
<input type="file" id="st-import-file" accept=".csv,text/csv" hidden />
<nav class="mobile-nav" aria-label="Navegación principal">
  <a href="app.html" data-st-nav="dashboard"><span class="ico">🏠</span>Inicio</a>
  <a href="productos.html" data-st-nav="productos"><span class="ico">📦</span>Catálogo</a>
  <a href="scanner.html" data-st-nav="scanner"><span class="ico">📷</span>Escanear</a>
  <a href="ventas.html" data-st-nav="ventas"><span class="ico">🛍</span>Ventas</a>
  <a href="chat.html" data-st-nav="chat"><span class="ico">✨</span>Geos</a>
</nav>
<div id="st-product-modal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog">
    <div class="modal-h"><h2 id="st-product-modal-title">Agregar producto</h2><button type="button" class="btn btn-ghost st-modal-close" data-modal="st-product-modal">×</button></div>
    <form id="st-product-form">
      <div class="form-group"><label class="form-label">Nombre</label><input class="input" name="name" required/></div>
      <div class="form-group"><label class="form-label">Código de barras</label><input class="input" name="barcode" placeholder="Opcional"/></div>
      <div class="form-group"><label class="form-label">Categoría</label><input class="input" name="category" placeholder="Ej. Herramientas"/></div>
      <div class="form-group"><label class="form-label">Emoji</label><input class="input" name="emoji" value="📦" maxlength="4"/></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
        <div class="form-group"><label class="form-label">Precio (CLP)</label><input class="input" name="price" type="number" min="0" required/></div>
        <div class="form-group"><label class="form-label">Stock</label><input class="input" name="stock" type="number" min="0" value="0"/></div>
        <div class="form-group"><label class="form-label">Mínimo</label><input class="input" name="stockMin" type="number" min="0" value="5"/></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center;">Guardar</button>
        <button type="button" class="btn btn-ghost st-modal-close" data-modal="st-product-modal">Cancelar</button>
      </div>
      <button type="button" id="st-delete-product" class="btn btn-ghost" hidden style="width:100%;margin-top:10px;color:var(--error);border-color:rgba(239,68,68,0.35);">Eliminar producto</button>
    </form>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
