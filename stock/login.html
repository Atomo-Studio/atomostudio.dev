<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Iniciar sesión · Stock</title>
<link rel="icon" type="image/svg+xml" href="../atomostudio/img/logo-atomo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script src="verticals.js"></script>
<script src="../js/geo-api-bridge.js"></script>
<script src="api.js"></script>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

</head>
<body data-st-page="login" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#06060a;">

<div style="width:100%;max-width:400px;padding:24px;">
  <div style="text-align:center;margin-bottom:28px;">
    <img src="../atomostudio/img/logo-atomo.svg" width="48" height="48" alt="Átomo" style="margin-bottom:12px;"/>
    <h1 style="font-size:22px;font-weight:700;margin-bottom:6px;">Stock</h1>
    <p style="font-size:13.5px;color:var(--text2);">Usa la misma cuenta que Geo App (Gmail)</p>
  </div>

  <div class="card" style="padding:24px;display:flex;flex-direction:column;gap:14px;">
    <div id="st-login-error" hidden style="font-size:13px;color:#f87171;padding:8px 12px;background:rgba(239,68,68,0.12);border-radius:8px;"></div>

    <button type="button" id="st-google-login" class="btn" style="justify-content:center;gap:10px;background:#fff;border:1px solid var(--border);color:#111;font-weight:600;">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.91a8.78 8.78 0 0 0 2.68-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.8.54-1.84.86-3.05.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A8.99 8.99 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.16.29-1.71V4.96H.96A8.99 8.99 0 0 0 0 9c0 1.45.35 2.82.96 4.04l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.33l2.58-2.58C13.46.89 11.43 0 9 0A8.99 8.99 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continuar con Google
    </button>

    <div style="display:flex;align-items:center;gap:10px;margin:4px 0 2px;">
      <div style="flex:1;height:1px;background:var(--border);"></div>
      <span style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;">o con email</span>
      <div style="flex:1;height:1px;background:var(--border);"></div>
    </div>

    
        <!-- Google Sign-In -->
        <div style="margin-bottom: 18px;">
          <div id="g_id_onload"
               data-client_id="517131771267-1mjcjk1op674643o8rtl8uhrjodckhrs.apps.googleusercontent.com"
               data-context="signin"
               data-ux_mode="redirect"
               data-callback="handleGoogleSignIn"
               data-login_uri="https://stock.atomostudio.dev/stock/login.html"
               data-auto_prompt="false">
          </div>
          <div class="g_id_signin"
               data-type="standard"
               data-shape="rectangular"
               data-theme="outline"
               data-text="continue_with"
               data-size="large"
               data-logo_alignment="left"
               data-width="100%">
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
          <div style="flex:1;height:1px;background:#e0e0e0;"></div>
          <span style="color:#999;font-size:12px;">o con email</span>
          <div style="flex:1;height:1px;background:#e0e0e0;"></div>
        </div>

      <form id="st-login-form" method="post" action="#" style="display:flex;flex-direction:column;gap:14px;margin:0;">
      <div style="margin:0;">
        <div style="font-size:11px;color:var(--text2);font-weight:600;margin-bottom:6px;">Email</div>
        <input style="width:100%;padding:11px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;" type="email" name="email" autocomplete="email" placeholder="tu@email.com"/>
      </div>
      <div style="margin:0;">
        <div style="font-size:11px;color:var(--text2);font-weight:600;margin-bottom:6px;">Contraseña</div>
        <input style="width:100%;padding:11px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;" type="password" name="password" autocomplete="current-password" placeholder="••••••••"/>
      </div>
      <button type="submit" class="btn btn-ghost" style="justify-content:center;">Iniciar con email</button>
    </form>
  </div>

  <p style="text-align:center;margin-top:16px;font-size:12.5px;color:var(--text3);">
    ¿Primera vez? Al entrar con Google se crea tu cuenta Geo automáticamente.
  </p>
  <p style="text-align:center;margin-top:10px;font-size:12px;">
    <a href="landing.html" style="color:var(--blue-2);">← Volver a la página de Stock</a>
  </p>
</div>

<script src="app.js">
    async function handleGoogleSignIn(response) {
      try {
        const data = await fetch(API_URL + "/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id_token: response.credential }),
        });
        if (!data.ok) {
          const err = await data.json().catch(function() { return { detail: "Error" }; });
          throw new Error(err.detail || "Error al iniciar sesión con Google");
        }
        const result = await data.json();
        localStorage.setItem("stock_token", result.token);
        localStorage.setItem("stock_user", JSON.stringify(result.user));
        window.location.href = "app.html";
      } catch (err) {
        console.error("Google Sign-In error:", err);
        alert("Error al iniciar sesión con Google: " + err.message);
      }
    }


  (function() {
    var params = new URLSearchParams(window.location.search);
    var credential = params.get("credential");
    if (credential) {
      window.history.replaceState({}, document.title, window.location.pathname);
      handleGoogleSignIn({ credential: credential });
    }
  })();

  </script>
</body>
</html>
