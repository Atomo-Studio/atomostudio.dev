<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ventas · Stock</title>
<link rel="icon" type="image/svg+xml" href="../atomostudio/img/logo-atomo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script src="verticals.js"></script>
<script src="api.js"></script>
</head>
<body data-st-page="ventas">
<div class="app">
  <aside class="sidebar">
    <div class="sb-h"><img class="logo" src="../atomostudio/img/logo-atomo.svg" width="28" height="28" alt=""/><div class="sb-h-name">Stock<small>by Átomo</small></div></div>
    <div class="sb-site"><div class="sb-site-thumb st-business-thumb">—</div><div class="sb-site-meta"><div class="sb-site-name st-business-name">Mi negocio</div><div class="sb-site-url st-business-type">—</div></div></div>
    <nav class="sb-nav">
      <a href="app.html" class="sb-item"><span class="ico"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="2.5" width="5" height="5" rx="1"/><rect x="10.5" y="2.5" width="5" height="5" rx="1"/><rect x="2.5" y="10.5" width="5" height="5" rx="1"/><rect x="10.5" y="10.5" width="5" height="5" rx="1"/></svg></span>Inicio</a>
      <a href="productos.html" class="sb-item"><span class="ico"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="12" height="10" rx="1.5"/><path d="M3 8h12"/></svg></span><span class="st-catalog-nav">Catálogo</span></a>
      <a href="scanner.html" class="sb-item"><span class="ico"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h2V4H3v2zm10 0h2V4h-2v2zM3 14h2v-2H3v2zm10 0h2v-2h-2v2z"/><rect x="6" y="7" width="6" height="4" rx="0.5"/></svg></span>Escáner</a>
      <a href="ventas.html" class="sb-item active"><span class="ico"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="6.5"/><path d="M6 9h6M9 6v6"/></svg></span>Ventas</a>
      <a href="chat.html" class="sb-item"><span class="ico"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5c0-3 2.5-5.5 5.5-5.5h1c3 0 5.5 2.5 5.5 5.5v.5c0 3-2.5 5.5-5.5 5.5H7l-3 2v-2.7a5.5 5.5 0 0 1-.5-2.3v-3z"/></svg></span>Geos</a>
      <a href="configuracion.html" class="sb-item"><span class="ico"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="2.5"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2"/></svg></span>Configuración</a>
    </nav>
    <div class="sb-foot"><div class="sb-foot-avatar st-foot-avatar">—</div><div class="sb-foot-meta"><div class="sb-foot-name st-client-name">—</div><div class="sb-foot-role st-business-name">—</div></div><button type="button" class="btn btn-ghost st-logout" style="padding:6px 10px;font-size:12px;">↪</button></div>
  </aside>
  <main class="main st-page-main">
    <header class="topbar"><div class="top-title">Ventas</div><div class="top-actions"><a href="scanner.html" class="btn btn-ghost">📷 Escáner</a></div></header>
    <div class="content">
      <div class="stats" style="grid-template-columns:repeat(2,1fr);margin-bottom:22px;">
        <div class="stat">
          <div class="stat-top"><div class="stat-label">Ventas recientes</div><div class="stat-icon green">🛍</div></div>
          <div class="stat-num grad" id="st-sales-count">—</div>
          <div class="stat-meta">Últimas 30 transacciones</div>
        </div>
        <div class="stat">
          <div class="stat-top"><div class="stat-label">Caja manual</div><div class="stat-icon blue">💵</div></div>
          <div class="stat-num" style="font-size:18px;">Registro rápido</div>
          <div class="stat-meta">Presencial u online</div>
        </div>
      </div>
      <div class="grid-2">
        <div class="card panel-card">
          <h3 class="card-title">Registrar venta</h3>
          <form id="st-sale-form">
            <div class="form-group"><label class="form-label">Producto</label><select class="select" name="productId" id="st-sale-product" required></select></div>
            <div class="form-group"><label class="form-label">Cantidad</label><input class="input" name="quantity" type="number" min="1" value="1" required/></div>
            <div class="form-group"><label class="form-label">Canal</label><select class="select" name="channel"><option value="presencial">Presencial</option><option value="online">Online</option></select></div>
            <button type="submit" class="btn btn-primary btn-block">Registrar venta</button>
          </form>
        </div>
        <div class="card panel-card">
          <div class="s-h" style="margin-top:0;"><h3>Historial reciente</h3></div>
          <div id="st-sales-list"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<nav class="mobile-nav" aria-label="Navegación principal">
  <a href="app.html" data-st-nav="dashboard"><span class="ico">🏠</span>Inicio</a>
  <a href="productos.html" data-st-nav="productos"><span class="ico">📦</span>Catálogo</a>
  <a href="scanner.html" data-st-nav="scanner"><span class="ico">📷</span>Escanear</a>
  <a href="ventas.html" data-st-nav="ventas"><span class="ico">🛍</span>Ventas</a>
  <a href="chat.html" data-st-nav="chat"><span class="ico">✨</span>Geos</a>
</nav>
<script src="app.js"></script>
</body>
</html>
