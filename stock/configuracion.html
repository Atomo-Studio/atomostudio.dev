  <main class="main st-page-main">
    <header class="topbar"><div class="top-title">Configuración</div></header>
    <div class="content">
      <div class="profile-card" style="max-width:560px;">
        <div class="profile-avatar st-business-thumb">—</div>
        <div>

          <div class="profile-meta"><span class="st-product-count">0</span> <span class="st-product-plural">productos</span> · CLP</div>

      </div>
      <div class="card panel-card" style="max-width:560px;">
        <h2 class="card-title">Configuración</h2>
        <form id="st-settings-form">
          <div class="form-group">
            <label class="form-label">Nombre del negocio</label>
            <input class="input st-business-name-field" disabled/>
            <p class="form-hint">Contacta a Átomo Studio para cambiar el nombre.</p>
          </div>
          <div class="form-group">
            <label class="form-label">Rubro / vertical</label>
            <select class="select" id="st-vertical-select"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Cuenta</label>
            <input class="input st-client-email" disabled/>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
            <button type="button" class="btn btn-ghost st-logout">Cerrar sesión</button>
            <a href="landing.html" class="btn btn-ghost">Volver a landing</a>
          </div>
        </form>
      </div>
