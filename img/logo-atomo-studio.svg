<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="96" fill="url(#grad)" opacity="0.15"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.3"/>

  <!-- Orbita 1 (horizontal) -->
  <ellipse cx="100" cy="100" rx="60" ry="18" fill="none" stroke="url(#grad)" stroke-width="2.5" opacity="0.7"
    transform="rotate(-30, 100, 100)"/>

  <!-- Orbita 2 -->
  <ellipse cx="100" cy="100" rx="60" ry="18" fill="none" stroke="url(#grad2)" stroke-width="2.5" opacity="0.7"
    transform="rotate(90, 100, 100)"/>

  <!-- Orbita 3 -->
  <ellipse cx="100" cy="100" rx="60" ry="18" fill="none" stroke="url(#grad)" stroke-width="2.5" opacity="0.7"
    transform="rotate(210, 100, 100)"/>

  <!-- Electrones en órbita -->
  <circle cx="47" cy="76" r="5" fill="#3b82f6" opacity="0.9"/>
  <circle cx="153" cy="124" r="5" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="152" cy="73" r="5" fill="#06b6d4" opacity="0.9"/>
  <circle cx="48" cy="127" r="5" fill="#6366f1" opacity="0.9"/>
  <circle cx="100" cy="44" r="5" fill="#3b82f6" opacity="0.9"/>
  <circle cx="100" cy="156" r="5" fill="#8b5cf6" opacity="0.9"/>

  <!-- Núcleo (átomo) -->
  <circle cx="100" cy="100" r="18" fill="url(#grad)" opacity="0.95"/>
  <text x="100" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Á</text>
</svg>
