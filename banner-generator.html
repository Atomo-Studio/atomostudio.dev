<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Átomo Studio — Generador de Banners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* =========== RESET & BASE =========== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-deep: #06060C;
            --bg-panel: #0A0A14;
            --bg-card: #12122A;
            --border: #1E293B;
            --border-hover: #334155;
            --blue: #3B82F6;
            --purple: #8B5CF6;
            --indigo: #6366F1;
            --glow: #A78BFA;
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* =========== HEADER =========== */
        .header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-badge {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            border-radius: 6px;
            padding: 2px 10px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #fff;
            -webkit-text-fill-color: white;
            letter-spacing: 0.5px;
        }
        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        /* =========== LAYOUT =========== */
        .app-container {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 0;
            min-height: calc(100vh - 75px);
        }
        @media (max-width: 900px) {
            .app-container { grid-template-columns: 1fr; }
            .panel-sidebar { border-right: none !important; border-bottom: 1px solid var(--border); }
        }

        /* =========== SIDEBAR =========== */
        .panel-sidebar {
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 75px);
        }
        .panel-sidebar::-webkit-scrollbar { width: 4px; }
        .panel-sidebar::-webkit-scrollbar-track { background: transparent; }
        .panel-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .section + .section { margin-top: 24px; }

        /* =========== PRESETS =========== */
        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .preset-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .preset-btn:hover { border-color: var(--purple); background: rgba(139,92,246,0.08); }
        .preset-btn.active { border-color: var(--purple); box-shadow: 0 0 0 1px rgba(139,92,246,0.3); background: rgba(139,92,246,0.12); }
        .preset-btn .icon { font-size: 1.3rem; display: block; margin-bottom: 4px; }
        .preset-btn .name { font-size: 0.75rem; font-weight: 500; color: var(--text-primary); }
        .preset-btn .dims { font-size: 0.65rem; color: var(--text-secondary); margin-top: 2px; }

        .platform-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .platform-chip {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .platform-chip:hover { border-color: var(--blue); color: var(--text-primary); }
        .platform-chip.active { background: linear-gradient(135deg, var(--blue), var(--purple)); border-color: transparent; color: white; }

        /* =========== FORM =========== */
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .form-group textarea,
        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }
        .form-group textarea:focus,
        .form-group input:focus { border-color: var(--blue); outline: none; }
        .form-group textarea { resize: vertical; min-height: 48px; }
        .form-group input[type="color"] {
            width: 100%;
            height: 38px;
            padding: 2px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-deep);
            cursor: pointer;
        }

        .color-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .range-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .range-row input[type="range"] {
            flex: 1;
            accent-color: var(--purple);
            height: 4px;
        }
        .range-val {
            font-size: 0.8rem;
            color: var(--text-secondary);
            min-width: 30px;
            text-align: right;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
        }

        /* =========== CANVAS AREA =========== */
        .canvas-area {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg-deep);
            overflow: auto;
            position: relative;
            min-height: 500px;
        }
        .canvas-area::-webkit-scrollbar { width: 6px; height: 6px; }
        .canvas-area::-webkit-scrollbar-track { background: transparent; }
        .canvas-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .canvas-wrap {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            position: relative;
            transition: all 0.3s;
        }
        .canvas-size-badge {
            position: absolute;
            top: -10px;
            right: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2px 12px;
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-family: 'Space Grotesk', sans-serif;
        }
        #bannerCanvas {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        .canvas-watermark {
            position: absolute;
            bottom: 24px;
            right: 24px;
            font-size: 0.6rem;
            color: var(--text-muted);
            font-family: 'Space Grotesk', sans-serif;
            opacity: 0.5;
            pointer-events: none;
        }

        /* =========== BUTTONS =========== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: white;
        }
        .btn-primary:hover { box-shadow: 0 4px 16px rgba(59,130,246,0.3); }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-secondary:hover { border-color: var(--text-secondary); color: var(--text-primary); }
        .btn-icon { padding: 8px 12px; }

        .action-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* =========== EXPORT MODAL =========== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 480px;
            width: 100%;
            box-shadow: var(--shadow);
        }
        .modal h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 16px;
        }
        .export-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .export-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .export-item .label { font-size: 0.85rem; font-weight: 500; }
        .export-item .sub { font-size: 0.7rem; color: var(--text-secondary); }
        .export-item .btn { padding: 6px 14px; font-size: 0.75rem; }

        .modal-close {
            float: right;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2rem;
        }
        .modal-close:hover { color: var(--text-primary); }

        /* =========== TOAST =========== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            pointer-events: none;
        }
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: var(--shadow);
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.3s;
            pointer-events: auto;
            backdrop-filter: blur(8px);
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* =========== RESPONSIVE =========== */
        @media (max-width: 600px) {
            .header { padding: 12px 16px; }
            .panel-sidebar { padding: 16px; max-height: none; }
            .canvas-area { padding: 12px; min-height: 300px; }
            .canvas-wrap { padding: 10px; }
            .preset-grid { grid-template-columns: 1fr 1fr; }
            .modal { padding: 20px; }
            .export-item { flex-direction: column; gap: 8px; align-items: flex-start; }
        }
    </style>
</head>
<body>

<!-- ========== HEADER ========== -->
<header class="header">
    <div class="brand">
        ⚛ Átomo Studio
        <span class="brand-badge">Banner Generator</span>
    </div>
    <div class="header-actions">
        <button class="btn btn-secondary" onclick="regenerateParticles()">
            🔄 Regenerar
        </button>
        <button class="btn btn-primary" onclick="openExportModal()">
            ⬇ Exportar
        </button>
    </div>
</header>

<!-- ========== APP ========== -->
<div class="app-container">

    <!-- SIDEBAR -->
    <div class="panel-sidebar">

        <!-- Presets de plataforma -->
        <div class="section">
            <div class="section-title">📱 Plataforma</div>
            <div class="platform-grid" id="platformGrid">
                <button class="platform-chip active" data-w="1200" data-h="400" onclick="setPlatform(this,'1200','400')">🌐 Web</button>
                <button class="platform-chip" data-w="1080" data-h="1920" onclick="setPlatform(this,'1080','1920')">📱 WhatsApp</button>
                <button class="platform-chip" data-w="1080" data-h="1920" onclick="setPlatform(this,'1080','1920')">📸 Instagram Story</button>
                <button class="platform-chip" data-w="1080" data-h="1080" onclick="setPlatform(this,'1080','1080')">📋 Instagram Feed</button>
                <button class="platform-chip" data-w="1200" data-h="628" onclick="setPlatform(this,'1200','628')">📰 Facebook Cover</button>
                <button class="platform-chip" data-w="1200" data-h="400" onclick="setPlatform(this,'1200','400')">🖥 LinkedIn Banner</button>
            </div>
        </div>

        <!-- Presets de estilo -->
        <div class="section">
            <div class="section-title">🎨 Estilo</div>
            <div class="preset-grid">
                <button class="preset-btn active" onclick="loadPreset('atomo', this)">
                    <span class="icon">⚛</span>
                    <span class="name">Átomo Studio</span>
                    <span class="dims">Brand default</span>
                </button>
                <button class="preset-btn" onclick="loadPreset('dark', this)">
                    <span class="icon">🌑</span>
                    <span class="name">Dark Premium</span>
                    <span class="dims">Elegante</span>
                </button>
                <button class="preset-btn" onclick="loadPreset('ocean', this)">
                    <span class="icon">🌊</span>
                    <span class="name">Ocean Tech</span>
                    <span class="dims">Azul profundo</span>
                </button>
                <button class="preset-btn" onclick="loadPreset('sunset', this)">
                    <span class="icon">🌅</span>
                    <span class="name">Sunset</span>
                    <span class="dims">Cálido</span>
                </button>
                <button class="preset-btn" onclick="loadPreset('minimal', this)">
                    <span class="icon">◇</span>
                    <span class="name">Minimal</span>
                    <span class="dims">Claro limpio</span>
                </button>
                <button class="preset-btn" onclick="loadPreset('neon', this)">
                    <span class="icon">💜</span>
                    <span class="name">Neon Nights</span>
                    <span class="dims">Vibrante</span>
                </button>
            </div>
        </div>

        <!-- Contenido -->
        <div class="section">
            <div class="section-title">✏️ Contenido</div>
            <div class="form-group">
                <label>Texto principal</label>
                <textarea id="cfg-main" rows="2" oninput="updateFromPanel()">Transformamos tu idea en web</textarea>
            </div>
            <div class="form-group">
                <label>Subtítulo</label>
                <input type="text" id="cfg-sub" value="Átomo Studio · atomostudio.dev" oninput="updateFromPanel()">
            </div>
        </div>

        <!-- Colores -->
        <div class="section">
            <div class="section-title">🎯 Colores</div>
            <div class="color-row">
                <div class="form-group">
                    <label>Fondo inicio</label>
                    <input type="color" id="cfg-color1" value="#06060C" oninput="updateFromPanel()">
                </div>
                <div class="form-group">
                    <label>Fondo fin</label>
                    <input type="color" id="cfg-color2" value="#0A0A14" oninput="updateFromPanel()">
                </div>
            </div>
            <div class="color-row">
                <div class="form-group">
                    <label>Partículas</label>
                    <input type="color" id="cfg-particle" value="#3B82F6" oninput="updateFromPanel()">
                </div>
                <div class="form-group">
                    <label>Acento</label>
                    <input type="color" id="cfg-accent" value="#8B5CF6" oninput="updateFromPanel()">
                </div>
            </div>
            <div class="color-row">
                <div class="form-group">
                    <label>Texto principal</label>
                    <input type="color" id="cfg-textcolor" value="#FFFFFF" oninput="updateFromPanel()">
                </div>
                <div class="form-group">
                    <label>Subtítulo</label>
                    <input type="color" id="cfg-subcolor" value="#94A3B8" oninput="updateFromPanel()">
                </div>
            </div>
        </div>

        <!-- Ajustes -->
        <div class="section">
            <div class="section-title">⚙️ Ajustes</div>
            <div class="form-group">
                <label>Tamaño texto</label>
                <div class="range-row">
                    <input type="range" id="cfg-fontsize" min="16" max="80" value="44" step="1" oninput="document.getElementById('fs-val').textContent=this.value; updateFromPanel()">
                    <span class="range-val" id="fs-val">44</span>
                </div>
            </div>
            <div class="form-group">
                <label>Partículas</label>
                <div class="range-row">
                    <input type="range" id="cfg-pcount" min="0" max="100" value="40" step="5" oninput="document.getElementById('pc-val').textContent=this.value; updateFromPanel()">
                    <span class="range-val" id="pc-val">40</span>
                </div>
            </div>
            <div class="form-group">
                <label>Conexiones entre partículas</label>
                <div class="range-row">
                    <input type="range" id="cfg-connection" min="0" max="250" value="120" step="10" oninput="document.getElementById('cn-val').textContent=this.value+'px'; updateFromPanel()">
                    <span class="range-val" id="cn-val">120px</span>
                </div>
            </div>
            <div class="form-group">
                <label>Opacidad overlay</label>
                <div class="range-row">
                    <input type="range" id="cfg-overlay" min="0" max="80" value="25" step="5" oninput="document.getElementById('ov-val').textContent=this.value+'%'; updateFromPanel()">
                    <span class="range-val" id="ov-val">25%</span>
                </div>
            </div>
        </div>

    </div>

    <!-- CANVAS -->
    <div class="canvas-area" id="canvasArea">
        <div class="canvas-wrap" id="canvasWrap">
            <span class="canvas-size-badge" id="sizeBadge">1200 × 400</span>
            <canvas id="bannerCanvas" width="1200" height="400"></canvas>
        </div>
    </div>

</div>

<!-- ========== EXPORT MODAL ========== -->
<div class="modal-overlay" id="exportModal">
    <div class="modal">
        <button class="modal-close" onclick="closeExportModal()">✕</button>
        <h3>⬇ Exportar banner</h3>
        <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:16px;">
            Descarga tu banner en múltiples tamaños. El diseño se adapta automáticamente.
        </p>
        <div class="export-list" id="exportList">
            <!-- Generado por JS -->
        </div>
    </div>
</div>

<!-- ========== TOAST ========== -->
<div class="toast-container"><div class="toast" id="toast"></div></div>

<script>
// ============================================================
// CONFIGURACIÓN INICIAL
// ============================================================
const PRESETS = {
    atomo: {
        main: 'Transformamos tu idea en web',
        sub: 'Átomo Studio · atomostudio.dev',
        color1: '#06060C',
        color2: '#0A0A14',
        particle: '#3B82F6',
        accent: '#8B5CF6',
        textcolor: '#FFFFFF',
        subcolor: '#94A3B8',
        fontsize: 44
    },
    dark: {
        main: 'Creamos tu presencia digital',
        sub: 'Diseño · Desarrollo · Estrategia',
        color1: '#0f172a',
        color2: '#1e1b4b',
        particle: '#8b5cf6',
        accent: '#6366f1',
        textcolor: '#ffffff',
        subcolor: '#a5b4fc',
        fontsize: 44
    },
    ocean: {
        main: 'Navega el futuro digital',
        sub: 'Tecnología al servicio de tu negocio',
        color1: '#020617',
        color2: '#0f4c81',
        particle: '#38bdf8',
        accent: '#0ea5e9',
        textcolor: '#ffffff',
        subcolor: '#7dd3fc',
        fontsize: 40
    },
    sunset: {
        main: 'Tu historia merece ser contada',
        sub: 'Creamos juntos algo extraordinario',
        color1: '#1c1917',
        color2: '#7c2d12',
        particle: '#fb923c',
        accent: '#f97316',
        textcolor: '#ffffff',
        subcolor: '#fed7aa',
        fontsize: 40
    },
    minimal: {
        main: 'Simple. Efectivo. Profesional.',
        sub: 'Tu web en 72 horas',
        color1: '#ffffff',
        color2: '#f1f5f9',
        particle: '#3b82f6',
        accent: '#6366f1',
        textcolor: '#0f172a',
        subcolor: '#475569',
        fontsize: 44
    },
    neon: {
        main: 'Destaca. Brilla. Conquista.',
        sub: 'Diseño que impacta · Átomo Studio',
        color1: '#050510',
        color2: '#2a0047',
        particle: '#c026d3',
        accent: '#e11d48',
        textcolor: '#ffffff',
        subcolor: '#d946ef',
        fontsize: 40
    }
};

// ============================================================
// CANVAS ENGINE
// ============================================================
const canvas = document.getElementById('bannerCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
let animId;
let config = { ...PRESETS.atomo };
let currentPresetBtn = document.querySelector('.preset-btn');

// Vista previa en tiempo real (debounced)
let updateTimeout;

function scheduleUpdate() {
    clearTimeout(updateTimeout);
    updateTimeout = setTimeout(redraw, 50);
}

// ============================================================
// PLATFORM MANAGEMENT
// ============================================================
function setPlatform(btn, w, h) {
    document.querySelectorAll('.platform-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    canvas.width = parseInt(w);
    canvas.height = parseInt(h);
    document.getElementById('sizeBadge').textContent = `${w} × ${h}`;
    initParticles();
    redraw();
}

// ============================================================
// PRESETS
// ============================================================
function loadPreset(name, btn) {
    if (currentPresetBtn) currentPresetBtn.classList.remove('active');
    btn.classList.add('active');
    currentPresetBtn = btn;
    config = { ...PRESETS[name] };
    applyConfigToPanel();
    redraw();
}

function applyConfigToPanel() {
    document.getElementById('cfg-main').value = config.main;
    document.getElementById('cfg-sub').value = config.sub;
    document.getElementById('cfg-color1').value = config.color1;
    document.getElementById('cfg-color2').value = config.color2;
    document.getElementById('cfg-particle').value = config.particle;
    document.getElementById('cfg-accent').value = config.accent || '#8B5CF6';
    document.getElementById('cfg-textcolor').value = config.textcolor;
    document.getElementById('cfg-subcolor').value = config.subcolor;
    document.getElementById('cfg-fontsize').value = config.fontsize;
    document.getElementById('fs-val').textContent = config.fontsize;
}

function updateFromPanel() {
    config.main = document.getElementById('cfg-main').value;
    config.sub = document.getElementById('cfg-sub').value;
    config.color1 = document.getElementById('cfg-color1').value;
    config.color2 = document.getElementById('cfg-color2').value;
    config.particle = document.getElementById('cfg-particle').value;
    config.accent = document.getElementById('cfg-accent').value || '#8B5CF6';
    config.textcolor = document.getElementById('cfg-textcolor').value;
    config.subcolor = document.getElementById('cfg-subcolor').value;
    config.fontsize = parseInt(document.getElementById('cfg-fontsize').value);

    // Desmarcar preset activo si se edita manualmente
    if (currentPresetBtn) {
        currentPresetBtn.classList.remove('active');
        currentPresetBtn = null;
    }

    initParticles();
    redraw();
}

// ============================================================
// PARTICLE SYSTEM
// ============================================================
class Particle {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = (Math.random() - 0.5) * 0.6;
        this.size = Math.random() * 2.5 + 0.8;
        this.alpha = Math.random() * 0.5 + 0.15;
        this.pulse = Math.random() * Math.PI * 2;
        this.pulseSpeed = 0.02 + Math.random() * 0.03;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.pulse += this.pulseSpeed;
        // Wrap around edges
        if (this.x < -10) this.x = canvas.width + 10;
        if (this.x > canvas.width + 10) this.x = -10;
        if (this.y < -10) this.y = canvas.height + 10;
        if (this.y > canvas.height + 10) this.y = -10;
    }
    draw() {
        const hex = config.particle;
        const r = parseInt(hex.slice(1,3),16);
        const g = parseInt(hex.slice(3,5),16);
        const b = parseInt(hex.slice(5,7),16);
        const pulseAlpha = this.alpha * (0.7 + 0.3 * Math.sin(this.pulse));
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${r},${g},${b},${pulseAlpha})`;
        ctx.fill();
    }
}

function initParticles() {
    particles = [];
    const count = Math.max(0, parseInt(document.getElementById('cfg-pcount')?.value || '40'));
    for (let i = 0; i < count; i++) particles.push(new Particle());
}

function regenerateParticles() {
    initParticles();
    showToast('🔄 Fondo regenerado');
}

// ============================================================
// DRAWING ENGINE
// ============================================================
function hexToRgb(hex, alpha) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
}

function drawBackground() {
    // Gradiente principal
    const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    grad.addColorStop(0, config.color1);
    grad.addColorStop(0.5, config.color2);
    // Acerca del punto medio con el accent
    const accent = config.accent || '#8B5CF6';
    const ar = parseInt(accent.slice(1,3),16);
    const ag = parseInt(accent.slice(3,5),16);
    const ab = parseInt(accent.slice(5,7),16);
    const midGrad = ctx.createRadialGradient(canvas.width * 0.3, canvas.height * 0.4, 10, canvas.width * 0.3, canvas.height * 0.4, canvas.width * 0.5);
    midGrad.addColorStop(0, `rgba(${ar},${ag},${ab},0.15)`);
    midGrad.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = midGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Vignette
    const vignette = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width*0.2, canvas.width/2, canvas.height/2, canvas.width*0.8);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    const ov = parseInt(document.getElementById('cfg-overlay')?.value || '25') / 100;
    vignette.addColorStop(1, `rgba(0,0,0,${ov})`);
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawParticles() {
    particles.forEach(p => { p.update(); p.draw(); });
}

function drawConnections() {
    const maxDist = parseInt(document.getElementById('cfg-connection')?.value || '120');
    if (maxDist === 0) return;

    const hex = config.particle;
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);

    ctx.lineWidth = 0.5;
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < maxDist) {
                const alpha = (1 - dist / maxDist) * 0.2;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
                ctx.stroke();
            }
        }
    }
}

function drawText() {
    const w = canvas.width;
    const h = canvas.height;
    const isVertical = h > w; // 1080×1920 mode

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Sombra para legibilidad
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 20;

    // Texto principal
    let fs = config.fontsize;
    // Auto-scale based on canvas width
    const baseWidth = 1200;
    const scaleFactor = Math.min(1, w / baseWidth);
    fs = Math.max(16, Math.round(fs * scaleFactor));

    ctx.fillStyle = config.textcolor;
    ctx.font = `700 ${fs}px "Space Grotesk", sans-serif`;

    // Word wrap
    const maxWidth = w - 80;
    const words = config.main.split(' ');
    let lines = [], line = '';
    for (let wd of words) {
        const test = line ? line + ' ' + wd : wd;
        if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = wd;
        } else {
            line = test;
        }
    }
    lines.push(line);

    const lh = fs * 1.3;
    const totalH = lines.length * lh;
    const textY = isVertical ? h * 0.48 : h / 2 - totalH / 2 - 10;

    lines.forEach((l, i) => {
        ctx.fillText(l, w / 2, textY + i * lh);
    });

    // Subtítulo
    ctx.shadowBlur = 0;
    ctx.font = `400 ${Math.round(fs * 0.5)}px "Inter", sans-serif`;
    ctx.fillStyle = config.subcolor;
    ctx.fillText(config.sub, w / 2, textY + totalH + (isVertical ? 32 : 24));
}

function redraw() {
    if (animId) cancelAnimationFrame(animId);
    drawStatic();
}

function drawStatic() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    drawParticles();
    drawConnections();
    drawText();
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    particles.forEach(p => { p.update(); p.draw(); });
    drawConnections();
    drawText();
    animId = requestAnimationFrame(animate);
}

// ============================================================
// EXPORT
// ============================================================
function openExportModal() {
    const sizes = [
        { label: 'WhatsApp Status', w: 1080, h: 1920, icon: '📱' },
        { label: 'Instagram Story', w: 1080, h: 1920, icon: '📸' },
        { label: 'Instagram Feed', w: 1080, h: 1080, icon: '📋' },
        { label: 'Facebook Cover', w: 1200, h: 628, icon: '📰' },
        { label: 'LinkedIn Banner', w: 1200, h: 400, icon: '🖥' },
        { label: 'Web Banner', w: 1200, h: 400, icon: '🌐' },
        { label: 'YouTube Banner', w: 2560, h: 1440, icon: '▶️' },
        { label: 'Twitter Header', w: 1500, h: 500, icon: '🐦' }
    ];

    const list = document.getElementById('exportList');
    list.innerHTML = '';
    sizes.forEach(s => {
        const item = document.createElement('div');
        item.className = 'export-item';
        item.innerHTML = `
            <div>
                <div class="label">${s.icon} ${s.label}</div>
                <div class="sub">${s.w} × ${s.h} · PNG</div>
            </div>
            <button class="btn btn-primary" onclick="exportSize(${s.w},${s.h},'${s.label}')">Descargar</button>
        `;
        list.appendChild(item);
    });

    document.getElementById('exportModal').classList.add('show');
}

function closeExportModal() {
    document.getElementById('exportModal').classList.remove('show');
}

function exportSize(w, h, label) {
    // Renderizar en canvas temporal
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = w;
    tempCanvas.height = h;
    const tempCtx = tempCanvas.getContext('2d');

    // Guardar config original
    const ogCanvas = { w: canvas.width, h: canvas.height };

    // Render estático con las dimensiones solicitadas
    renderToCanvas(tempCtx, w, h);

    const link = document.createElement('a');
    const slug = label.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    link.download = `atomo-${slug}-${w}x${h}.png`;
    link.href = tempCanvas.toDataURL('image/png');
    link.click();
    showToast(`✅ ${label} descargado (${w}×${h})`);
}

function renderToCanvas(context, w, h) {
    const hex1 = config.color1;
    const hex2 = config.color2;
    const hexP = config.particle;
    const accent = config.accent || '#8B5CF6';

    // Fondo
    const grad = context.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, hex1);
    grad.addColorStop(1, hex2);
    context.fillStyle = grad;
    context.fillRect(0, 0, w, h);

    // Accent glow
    const ar = parseInt(accent.slice(1,3),16);
    const ag = parseInt(accent.slice(3,5),16);
    const ab = parseInt(accent.slice(5,7),16);
    const mid = context.createRadialGradient(w * 0.3, h * 0.4, 10, w * 0.3, h * 0.4, w * 0.5);
    mid.addColorStop(0, `rgba(${ar},${ag},${ab},0.12)`);
    mid.addColorStop(1, 'rgba(0,0,0,0)');
    context.fillStyle = mid;
    context.fillRect(0, 0, w, h);

    // Vignette
    const vig = context.createRadialGradient(w/2, h/2, w*0.2, w/2, h/2, w*0.8);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.25)');
    context.fillStyle = vig;
    context.fillRect(0, 0, w, h);

    // Partículas simplificadas (posición fija para export)
    const pCount = Math.max(10, Math.round(w * h / 30000));
    const pr = parseInt(hexP.slice(1,3),16);
    const pg = parseInt(hexP.slice(3,5),16);
    const pb = parseInt(hexP.slice(5,7),16);
    for (let i = 0; i < pCount; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const size = Math.random() * 2.5 + 0.5;
        const alpha = Math.random() * 0.4 + 0.1;
        context.beginPath();
        context.arc(x, y, size, 0, Math.PI * 2);
        context.fillStyle = `rgba(${pr},${pg},${pb},${alpha})`;
        context.fill();
    }

    // Texto
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    context.shadowColor = 'rgba(0,0,0,0.5)';
    context.shadowBlur = 15;

    let fs = config.fontsize;
    const scaleFactor = Math.min(1, w / 1200);
    fs = Math.max(16, Math.round(fs * scaleFactor));

    context.fillStyle = config.textcolor;
    context.font = `700 ${fs}px "Space Grotesk", sans-serif`;

    const isVertical = h > w;
    const maxWidth = w - 80;
    const words = config.main.split(' ');
    let lines = [], line = '';
    for (let wd of words) {
        const test = line ? line + ' ' + wd : wd;
        if (context.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = wd;
        } else {
            line = test;
        }
    }
    lines.push(line);

    const lh = fs * 1.3;
    const totalH = lines.length * lh;
    const textY = isVertical ? h * 0.48 : h / 2 - totalH / 2 - 10;

    lines.forEach((l, i) => context.fillText(l, w / 2, textY + i * lh));

    context.shadowBlur = 0;
    context.font = `400 ${Math.round(fs * 0.5)}px "Inter", sans-serif`;
    context.fillStyle = config.subcolor;
    context.fillText(config.sub, w / 2, textY + totalH + (isVertical ? 32 : 24));
}

function downloadCurrent() {
    cancelAnimationFrame(animId);
    drawStatic();
    const link = document.createElement('a');
    const slug = config.sub.split('·')[0]?.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'') || 'banner';
    link.download = `atomo-${slug}-${canvas.width}x${canvas.height}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('✅ Banner descargado');
    animate();
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._hide);
    t._hide = setTimeout(() => t.classList.remove('show'), 2500);
}

// INIT
// ============================================================
// Click fuera del modal lo cierra
document.getElementById('exportModal').addEventListener('click', function(e) {
    if (e.target === this) closeExportModal();
});

// Tecla Escape cierra modal
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeExportModal();
});

// Auto-redraw on resize
let resizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        // El canvas no cambia de tamaño, solo el contenedor
        // Forzamos re-render por si cambió la escala visual
    }, 200);
});

initParticles();
animate();
showToast('⚛ Banner Generator listo');
</script>
