<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gGlobe" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gGlobeHover" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f9af9"/>
      <stop offset="0.5" stop-color="#7c74f5"/>
      <stop offset="1" stop-color="#9d71f8"/>
    </linearGradient>
  </defs>

  <!-- Outer glow halo -->
  <circle cx="50" cy="50" r="48" fill="url(#gGlobe)" opacity="0.08"/>

  <!-- Globe base circle -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#gGlobe)" stroke-width="3.5"/>

  <!-- Latitudes (horizontal lines) -->
  <ellipse cx="50" cy="34" rx="24" ry="6" fill="none" stroke="url(#gGlobe)" stroke-width="2" opacity="0.7"/>
  <ellipse cx="50" cy="50" rx="28" ry="6" fill="none" stroke="url(#gGlobe)" stroke-width="2" opacity="0.5"/>
  <ellipse cx="50" cy="66" rx="24" ry="6" fill="none" stroke="url(#gGlobe)" stroke-width="2" opacity="0.7"/>

  <!-- Longitude (vertical arc) -->
  <path d="M26 40 Q30 50 26 60" fill="none" stroke="url(#gGlobe)" stroke-width="2" opacity="0.6"/>
  <path d="M74 40 Q70 50 74 60" fill="none" stroke="url(#gGlobe)" stroke-width="2" opacity="0.6"/>

  <!-- Center dot (location pin metaphor) -->
  <circle cx="50" cy="50" r="5" fill="url(#gGlobe)"/>

  <!-- Small orbital dots -->
  <circle cx="22" cy="42" r="2.5" fill="#3b82f6" opacity="0.5"/>
  <circle cx="78" cy="58" r="2.5" fill="#6366f1" opacity="0.4"/>
  <circle cx="42" cy="82" r="2" fill="#8b5cf6" opacity="0.3"/>
</svg>
