<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="aGrad" x1="0" y1="0" x2="100" y2="100">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="50" cy="50" r="48" fill="url(#aGrad)" opacity="0.08"/>
  <!-- Electron orbit 1 -->
  <ellipse cx="50" cy="30" rx="28" ry="10" fill="none" stroke="url(#aGrad)" stroke-width="2.5" opacity="0.5" transform="rotate(-30 50 50)"/>
  <!-- Electron orbit 2 -->
  <ellipse cx="50" cy="30" rx="28" ry="10" fill="none" stroke="url(#aGrad)" stroke-width="2.5" opacity="0.5" transform="rotate(30 50 50)"/>
  <!-- Electron orbit 3 (horizontal) -->
  <ellipse cx="50" cy="30" rx="28" ry="10" fill="none" stroke="url(#aGrad)" stroke-width="2.5" opacity="0.5" transform="rotate(90 50 50)"/>
  <!-- Nucleus -->
  <circle cx="50" cy="50" r="8" fill="url(#aGrad)"/>
  <!-- Electrons -->
  <circle cx="77" cy="34" r="3.5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="22" cy="44" r="3.5" fill="#6366f1" opacity="0.8"/>
  <circle cx="50" cy="18" r="3.5" fill="#8b5cf6" opacity="0.8"/>
</svg>
