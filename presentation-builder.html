<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Átomo Studio — Creador de Presentaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* =========== RESET & VARIABLES =========== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-deep: #06060C;
            --bg-panel: #0A0A14;
            --bg-card: #12122A;
            --bg-hover: #1a1a3a;
            --border: #1E293B;
            --border-hover: #334155;
            --blue: #3B82F6;
            --purple: #8B5CF6;
            --indigo: #6366F1;
            --glow: #A78BFA;
            --success: #10B981;
            --danger: #EF4444;
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0,0,0,0.5);
            --header-h: 56px;
            --toolbar-h: 48px;
        }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
        }

        /* =========== BUTTONS =========== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn:hover { background: var(--bg-hover); border-color: var(--border-hover); color: var(--text-primary); }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, var(--blue), var(--purple)); border-color: transparent; color: white; }
        .btn-primary:hover { box-shadow: 0 4px 16px rgba(59,130,246,0.3); }
        .btn-danger { color: var(--danger); border-color: rgba(239,68,68,0.3); }
        .btn-danger:hover { background: rgba(239,68,68,0.15); border-color: var(--danger); color: var(--danger); }
        .btn-success { background: var(--success); border-color: transparent; color: white; }
        .btn-success:hover { box-shadow: 0 4px 16px rgba(16,185,129,0.3); }
        .btn-sm { padding: 4px 10px; font-size: 0.7rem; }
        .btn-icon { padding: 8px; width: 34px; height: 34px; justify-content: center; }

        /* =========== HEADER =========== */
        .header {
            height: var(--header-h);
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            z-index: 100;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: auto;
        }
        .brand i { font-style: normal; background: none; -webkit-text-fill-color: white; font-size: 1.1rem; }
        .header-actions { display: flex; gap: 6px; flex-wrap: nowrap; }
        @media (max-width: 600px) {
            .header { padding: 0 8px; gap: 6px; }
            .header-actions .btn span { display: none; }
            .brand span { display: none; }
        }

        /* =========== LAYOUT =========== */
        .app-main {
            display: flex;
            height: calc(100vh - var(--header-h));
            overflow: hidden;
        }

        /* =========== SIDEBAR (SLIDE LIST) =========== */
        .sidebar {
            width: 220px;
            min-width: 220px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .sidebar-header {
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
        }
        .slide-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .slide-list::-webkit-scrollbar { width: 3px; }
        .slide-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .slide-thumb {
            aspect-ratio: 16/9;
            background: var(--bg-card);
            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            flex-shrink: 0;
            min-height: 80px;
        }
        .slide-thumb:hover { border-color: var(--blue); }
        .slide-thumb.active { border-color: var(--purple); box-shadow: 0 0 0 2px rgba(139,92,246,0.3); }
        .slide-thumb-num {
            position: absolute;
            top: 4px; left: 4px;
            background: rgba(0,0,0,0.6);
            color: var(--text-primary);
            font-size: 0.6rem;
            padding: 1px 6px;
            border-radius: 4px;
            z-index: 2;
            font-family: 'Space Grotesk', sans-serif;
        }
        .slide-thumb-mini {
            position: absolute;
            top: 0; left: 0;
            width: 400%;
            height: 400%;
            transform: scale(0.25);
            transform-origin: top left;
            pointer-events: none;
        }

        @media (max-width: 800px) {
            .sidebar { display: none; }
            .sidebar.mobile-show { display: flex; position: fixed; top: var(--header-h); left: 0; bottom: 0; width: 240px; z-index: 50; }
        }

        /* =========== EDITOR =========== */
        .editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Toolbar */
        .toolbar {
            height: var(--toolbar-h);
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 6px;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .toolbar::-webkit-scrollbar { height: 0; }
        .toolbar-divider { width: 1px; height: 24px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

        /* Canvas wrapper */
        .canvas-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
            background: radial-gradient(ellipse at center, var(--bg-panel) 0%, var(--bg-deep) 100%);
        }
        .canvas-wrapper::-webkit-scrollbar { width: 6px; height: 6px; }
        .canvas-wrapper::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        #currentSlide {
            width: 960px;
            min-width: 400px;
            aspect-ratio: 16/9;
            background: white;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            overflow: hidden;
            border-radius: 4px;
            transition: width 0.3s;
        }

        /* Elements */
        .slide-el {
            position: absolute;
            cursor: grab;
            user-select: none;
            border: 1px solid transparent;
            transition: border-color 0.15s;
        }
        .slide-el:hover { border-color: var(--blue); }
        .slide-el.selected { border-color: var(--purple) !important; z-index: 100; outline: 2px solid rgba(139,92,246,0.3); outline-offset: 1px; }
        .slide-el .resize-handle {
            display: none;
            width: 10px; height: 10px;
            background: var(--purple);
            position: absolute;
            right: -5px; bottom: -5px;
            cursor: se-resize;
            border-radius: 2px;
            border: 1px solid white;
        }
        .slide-el.selected .resize-handle { display: block; }

        /* =========== PROPERTIES PANEL =========== */
        .props-panel {
            width: 260px;
            min-width: 260px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .props-panel::-webkit-scrollbar { width: 3px; }
        .props-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .props-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            gap: 8px;
            flex: 1;
        }
        .props-empty i { font-size: 2rem; opacity: 0.3; }
        .props-empty p { font-size: 0.8rem; }

        .prop-section { }
        .prop-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }
        .prop-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .prop-row.three { grid-template-columns: 1fr 1fr 1fr; }
        .prop-label { display: block; font-size: 0.65rem; color: var(--text-secondary); margin-bottom: 3px; }
        .prop-input, .prop-input select, .prop-input textarea {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
        }
        .prop-input:focus, .prop-input select:focus { border-color: var(--blue); outline: none; }
        .prop-input textarea { resize: vertical; min-height: 50px; }
        .prop-input input[type="color"] {
            width: 100%;
            height: 32px;
            padding: 2px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-deep);
            cursor: pointer;
        }
        .prop-input input[type="number"] { width: 100%; }

        @media (max-width: 700px) {
            .props-panel { display: none; }
            .props-panel.mobile-show { display: flex; position: fixed; top: var(--header-h); right: 0; bottom: 0; width: 280px; z-index: 50; }
        }

        /* =========== FULLSCREEN PLAYER =========== */
        #playerOverlay {
            display: none;
            position: fixed; inset: 0;
            background: black;
            z-index: 500;
            align-items: center;
            justify-content: center;
        }
        #playerOverlay.show { display: flex; }
        #playerSlide {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .player-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 501;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
        }
        #playerOverlay:hover .player-bar { opacity: 1; }
        .player-btn {
            background: transparent;
            border: none;
            color: white;
            width: 44px; height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .player-btn:hover { background: rgba(255,255,255,0.15); }

        /* Animaciones de transición */
        .anim-slide-in { animation: slideInRight 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }
        .anim-fade-in { animation: fadeIn 0.6s ease forwards; }
        .anim-zoom-in { animation: zoomIn 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }
        .anim-none { }

        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* =========== MOBILE SIDEBAR TOGGLE =========== */
        .mobile-toggle {
            display: none;
            position: fixed;
            bottom: 20px; right: 20px;
            z-index: 60;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: white;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(59,130,246,0.4);
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 800px) {
            .mobile-toggle { display: flex; }
        }
        @media (max-width: 700px) {
            .mobile-toggle { display: flex; }
        }

        /* =========== TOAST =========== */
        .toast {
            position: fixed;
            bottom: 80px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s;
            z-index: 600;
            backdrop-filter: blur(8px);
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* =========== PRINT STYLES (PDF Export) =========== */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
            .slide-print { page-break-after: always; width: 100%; height: auto; aspect-ratio: 16/9; position: relative; overflow: hidden; }
        }
    </style>
</head>
<body>

<!-- ========== HEADER ========== -->
<header class="header">
    <div class="brand">
        <i>⚛</i> Átomo Studio <span>· Presentaciones</span>
    </div>
    <div class="header-actions">
        <button class="btn btn-sm" onclick="toggleSidebar()" title="Slides">
            <span>📋</span><span>Slides</span>
        </button>
        <button class="btn btn-sm btn-primary" onclick="addSlide()">
            <span>+</span><span>Añadir</span>
        </button>
        <button class="btn btn-sm btn-danger" onclick="deleteSlide()">
            <span>🗑</span><span>Eliminar</span>
        </button>
        <div style="width:1px;height:20px;background:var(--border);margin:0 2px;"></div>
        <button class="btn btn-sm" onclick="exportPDF()" title="Exportar PDF">
            📄 PDF
        </button>
        <button class="btn btn-sm" onclick="exportHTML()" title="Exportar HTML">
            💻 HTML
        </button>
        <button class="btn btn-sm btn-success" onclick="startPresentation()">
            ▶ <span>Presentar</span>
        </button>
    </div>
</header>

<!-- ========== MAIN ========== -->
<div class="app-main">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>📋 Slides</h3>
            <span id="slideCount" style="font-size:0.75rem;color:var(--text-muted);font-family:'Space Grotesk';">0</span>
        </div>
        <div class="slide-list" id="slideList"></div>
    </aside>

    <!-- EDITOR -->
    <div class="editor">
        <div class="toolbar">
            <div class="toolbar-divider"></div>
            <button class="btn btn-icon" onclick="addTextEl()" title="Texto">T</button>
            <button class="btn btn-icon" onclick="triggerImage()" title="Imagen">🖼</button>
            <button class="btn btn-icon" onclick="addShape('rect')" title="Rectángulo">▬</button>
            <button class="btn btn-icon" onclick="addShape('circle')" title="Círculo">●</button>
            <input type="file" id="imgInput" style="display:none" accept="image/*" onchange="handleImage(this)">
            <div class="toolbar-divider"></div>

            <button class="btn btn-icon" onclick="setSlideBg('#ffffff')" title="Fondo blanco" style="background:white;border-color:#ccc;">&nbsp;</button>
            <button class="btn btn-icon" onclick="setSlideBg('#06060C')" title="Fondo oscuro" style="background:#06060C;">&nbsp;</button>
            <button class="btn btn-icon" onclick="setSlideBg('#3B82F6')" title="Fondo azul" style="background:#3B82F6;">&nbsp;</button>
            <button class="btn btn-icon" onclick="setSlideBg('#8B5CF6')" title="Fondo púrpura" style="background:#8B5CF6;">&nbsp;</button>
            <input type="color" id="customBg" value="#ffffff" onchange="setSlideBg(this.value)" style="width:32px;height:32px;padding:0;border:1px solid var(--border);border-radius:4px;cursor:pointer;">

            <div class="toolbar-divider"></div>
            <span style="font-size:0.7rem;color:var(--text-muted);">Transición:</span>
            <select id="transSelect" onchange="setTransition(this.value)" style="background:var(--bg-deep);border:1px solid var(--border);color:var(--text-primary);padding:4px 8px;border-radius:4px;font-size:0.75rem;font-family:'Inter',sans-serif;">
                <option value="none">Ninguna</option>
                <option value="fade">Fundido</option>
                <option value="slide">Slide</option>
                <option value="zoom">Zoom</option>
            </select>

            <div class="toolbar-divider"></div>
            <button class="btn btn-sm" onclick="undoLast()" title="Deshacer" style="font-size:0.9rem;">↩</button>
        </div>

        <div class="canvas-wrapper" id="canvasWrapper">
            <div id="currentSlide" onclick="deselectAll(event)"></div>
        </div>
    </div>

    <!-- PROPERTIES -->
    <div class="props-panel" id="propsPanel">
        <div class="props-empty" id="propsEmpty">
            <i>👆</i>
            <p>Selecciona un elemento<br>para editar propiedades</p>
        </div>
        <div id="propsContent" style="display:none;">
            <div class="prop-section">
                <div class="prop-title">Posición</div>
                <div class="prop-row">
                    <div><label class="prop-label">X</label><input class="prop-input" type="number" id="pX" oninput="updateEl()"></div>
                    <div><label class="prop-label">Y</label><input class="prop-input" type="number" id="pY" oninput="updateEl()"></div>
                </div>
                <div class="prop-row">
                    <div><label class="prop-label">Ancho</label><input class="prop-input" type="number" id="pW" oninput="updateEl()"></div>
                    <div><label class="prop-label">Alto</label><input class="prop-input" type="number" id="pH" oninput="updateEl()"></div>
                </div>
                <div class="prop-row">
                    <button class="btn btn-sm" onclick="moveLayer(1)" style="flex:1;">↑ Subir</button>
                    <button class="btn btn-sm" onclick="moveLayer(-1)" style="flex:1;">↓ Bajar</button>
                </div>
            </div>
            <div class="prop-section" id="textProps" style="display:none;">
                <div class="prop-title">Texto</div>
                <textarea class="prop-input" id="pText" rows="2" oninput="updateEl()" style="margin-bottom:8px;"></textarea>
                <div class="prop-row">
                    <select class="prop-input" id="pFont" onchange="updateEl()">
                        <option value="Space Grotesk">Space Grotesk</option>
                        <option value="Inter">Inter</option>
                        <option value="Arial">Arial</option>
                        <option value="Georgia">Georgia</option>
                    </select>
                    <input class="prop-input" type="number" id="pSize" oninput="updateEl()" placeholder="Tamaño">
                </div>
                <div class="prop-row">
                    <div><label class="prop-label">Color</label><input class="prop-input" type="color" id="pColor" oninput="updateEl()"></div>
                    <div><label class="prop-label">Fondo</label><input class="prop-input" type="color" id="pBg" oninput="updateEl()"></div>
                </div>
                <div style="display:flex;gap:4px;">
                    <button class="btn btn-sm" onclick="setTextProp('bold')" style="flex:1;font-weight:700;">B</button>
                    <button class="btn btn-sm" onclick="setTextProp('italic')" style="flex:1;font-style:italic;">I</button>
                    <button class="btn btn-sm" onclick="setTextProp('left')" style="flex:1;">⬅</button>
                    <button class="btn btn-sm" onclick="setTextProp('center')" style="flex:1;">⬡</button>
                    <button class="btn btn-sm" onclick="setTextProp('right')" style="flex:1;">➡</button>
                </div>
            </div>
            <div class="prop-section" id="shapeProps" style="display:none;">
                <div class="prop-title">Forma</div>
                <div class="prop-row">
                    <div><label class="prop-label">Relleno</label><input class="prop-input" type="color" id="pFill" oninput="updateEl()"></div>
                    <div><label class="prop-label">Borde</label><input class="prop-input" type="color" id="pStroke" oninput="updateEl()"></div>
                </div>
                <div><label class="prop-label">Grosor borde</label><input class="prop-input" type="number" id="pStrokeW" min="0" value="0" oninput="updateEl()"></div>
            </div>
            <div class="prop-section" id="imgProps" style="display:none;">
                <div class="prop-title">Imagen</div>
                <button class="btn btn-sm" onclick="triggerImageReplace()" style="width:100%;">🖼 Cambiar imagen</button>
                <input type="file" id="imgReplace" style="display:none" accept="image/*" onchange="handleImageReplace(this)">
            </div>
            <button class="btn btn-danger" onclick="deleteSelected()" style="width:100%;margin-top:8px;">🗑 Eliminar elemento</button>
        </div>
    </div>

</div>

<!-- ========== PLAYER OVERLAY ========== -->
<div id="playerOverlay">
    <div id="playerSlide"></div>
    <div class="player-bar">
        <button class="player-btn" onclick="playerPrev()">◀</button>
        <button class="player-btn" onclick="playerExit()">✕</button>
        <button class="player-btn" onclick="playerNext()">▶</button>
    </div>
    <div style="position:fixed;bottom:90px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:0.8rem;font-family:'Space Grotesk';z-index:501;pointer-events:none;" id="playerCounter"></div>
</div>

<!-- ========== TOAST ========== -->
<div class="toast" id="toast"></div>

<!-- ========== PRINT AREA (hidden, used for PDF export) ========== -->
<div id="printArea" style="display:none;"></div>

<script>
// ============================================================
// STATE
// ============================================================
let slides = [];
let currentIdx = 0;
let selectedId = null;
let isDragging = false;
let isResizing = false;
let dragOff = { x: 0, y: 0 };
let resizeStart = { w: 0, h: 0, x: 0, y: 0 };
let undoStack = [];

// ============================================================
// INIT
// ============================================================
function init() {
    const saved = localStorage.getItem('atomo_pres');
    if (saved) {

// ============================================================
// SLIDE MANAGEMENT
// ============================================================
function renderThumbs() {
    const list = document.getElementById('slideList');
    list.innerHTML = '';
    document.getElementById('slideCount').textContent = slides.length;

    slides.forEach((s, idx) => {
        const thumb = document.createElement('div');
        thumb.className = `slide-thumb ${idx === currentIdx ? 'active' : ''}`;
        thumb.onclick = () => { saveSlide(); loadSlide(idx); };
        thumb.innerHTML = `<span class="slide-thumb-num">${idx + 1}</span>`;

        const mini = document.createElement('div');
        mini.className = 'slide-thumb-mini';
        mini.style.background = s.bg;

        s.elements.forEach(el => {
            const d = document.createElement('div');
            d.style.cssText = `position:absolute; left:${el.x}px; top:${el.y}px; width:${el.w}px; height:${el.h}px;`;
            if (el.type === 'text') {
                d.textContent = el.text;
                d.style.color = el.color;
                d.style.fontSize = (el.size * 0.25) + 'px';
                d.style.fontFamily = el.font || 'Space Grotesk';
                d.style.fontWeight = el.bold ? 'bold' : 'normal';
                d.style.whiteSpace = 'pre-wrap';
                d.style.overflow = 'hidden';
            } else if (el.type === 'shape') {
                d.style.backgroundColor = el.fill;
                d.style.borderRadius = el.shape === 'circle' ? '50%' : '0';
                if (el.stroke && el.strokeW) d.style.border = `${el.strokeW}px solid ${el.stroke}`;
            } else if (el.type === 'image') {
                const img = document.createElement('img');
                img.src = el.src;
                img.style.cssText = 'width:100%; height:100%; object-fit:cover;';
                d.appendChild(img);
            }
            mini.appendChild(d);
        });
        thumb.appendChild(mini);
        list.appendChild(thumb);
    });
}

function loadSlide(index) {
    currentIdx = Math.max(0, Math.min(index, slides.length - 1));
    const slide = slides[currentIdx];
    const el = document.getElementById('currentSlide');
    el.style.background = slide.bg;
    document.getElementById('transSelect').value = slide.transition || 'none';
    el.innerHTML = '';
    slide.elements.forEach(e => el.appendChild(createElDOM(e)));
    renderThumbs();
    deselectAll();
    updateTitle();
}

function saveSlide() {
    // Guarda estado actual antes de cambiar de slide
    slides[currentIdx].elements = collectElements();
}

function collectElements() {
    const els = [];
    document.querySelectorAll('#currentSlide .slide-el').forEach(dom => {
        const id = dom.id;
        const slide = slides[currentIdx];
        const data = slide.elements.find(e => e.id === id);
        if (data) els.push(data);
    });
    return els;
}

function updateTitle() {
    document.title = `Presentación - ${slides.length} slides · Átomo Studio`;
}

// ============================================================
// ELEMENT DOM CREATION
// ============================================================
function createElDOM(el) {
    const div = document.createElement('div');
    div.className = 'slide-el';
    div.id = el.id;
    div.style.cssText = `left:${el.x}px; top:${el.y}px; width:${el.w}px; height:${el.h}px;`;

    if (el.type === 'text') {
        div.textContent = el.text;
        div.style.fontFamily = el.font || 'Space Grotesk';
        div.style.fontSize = el.size + 'px';
        div.style.color = el.color;
        div.style.fontWeight = el.bold ? '700' : '400';
        div.style.fontStyle = el.italic ? 'italic' : 'normal';
        div.style.whiteSpace = 'pre-wrap';
        div.style.overflow = 'hidden';
        div.style.display = 'flex';
        div.style.alignItems = 'center';
        if (el.align === 'center') div.style.justifyContent = 'center';
        else if (el.align === 'right') div.style.justifyContent = 'flex-end';
        else div.style.justifyContent = 'flex-start';
        if (el.bg && el.bg !== '#ffffff' && el.bg !== '#FFFFFF' && el.bg !== '') {
            div.style.backgroundColor = el.bg;
            div.style.padding = '8px 12px';
            div.style.borderRadius = '4px';
            // Ajuste de tamaño por padding
            div.style.width = (el.w) + 'px';
            div.style.height = (el.h) + 'px';
        }
    } else if (el.type === 'shape') {
        div.style.backgroundColor = el.fill || '#8B5CF6';
        div.style.borderRadius = el.shape === 'circle' ? '50%' : '0';
        if (el.stroke && el.strokeW) div.style.border = `${el.strokeW}px solid ${el.stroke}`;
    } else if (el.type === 'image') {
        const img = document.createElement('img');
        img.src = el.src;
        img.style.cssText = 'width:100%; height:100%; object-fit:cover; pointer-events:none;';
        div.appendChild(img);
    }

    // Resize handle
    const h = document.createElement('div');
    h.className = 'resize-handle';
    div.appendChild(h);

    // Events
    div.addEventListener('mousedown', e => {
        if (e.target.classList.contains('resize-handle')) return;
        selectEl(el.id);
        startDrag(e, el.id);
    });
    h.addEventListener('mousedown', e => {
        e.stopPropagation();
        selectEl(el.id);
        startResize(e, el.id);
    });
    // Touch events for mobile
    div.addEventListener('touchstart', e => {
        if (e.target.classList.contains('resize-handle')) return;
        selectEl(el.id);
        startTouchDrag(e, el.id);
    }, { passive: true });

    return div;
}

// ============================================================
// SELECTION & PROPERTIES
// ============================================================
function selectEl(id) {
    selectedId = id;
    document.querySelectorAll('.slide-el').forEach(e => e.classList.remove('selected'));
    const dom = document.getElementById(id);
    if (dom) dom.classList.add('selected');
    const el = slides[currentIdx].elements.find(e => e.id === id);
    if (!el) return;

    document.getElementById('propsEmpty').style.display = 'none';
    document.getElementById('propsContent').style.display = 'block';

    document.getElementById('pX').value = Math.round(el.x);
    document.getElementById('pY').value = Math.round(el.y);
    document.getElementById('pW').value = Math.round(el.w);
    document.getElementById('pH').value = Math.round(el.h);

    if (el.type === 'text') {
        document.getElementById('textProps').style.display = 'block';
        document.getElementById('shapeProps').style.display = 'none';
        document.getElementById('imgProps').style.display = 'none';
        document.getElementById('pText').value = el.text;
        document.getElementById('pFont').value = el.font || 'Space Grotesk';
        document.getElementById('pSize').value = el.size;
        document.getElementById('pColor').value = el.color;
        document.getElementById('pBg').value = el.bg || '#ffffff';
    } else if (el.type === 'shape') {
        document.getElementById('textProps').style.display = 'none';
        document.getElementById('shapeProps').style.display = 'block';
        document.getElementById('imgProps').style.display = 'none';
        document.getElementById('pFill').value = el.fill || '#8B5CF6';
        document.getElementById('pStroke').value = el.stroke || '#000000';
        document.getElementById('pStrokeW').value = el.strokeW || 0;
    } else if (el.type === 'image') {
        document.getElementById('textProps').style.display = 'none';
        document.getElementById('shapeProps').style.display = 'none';
        document.getElementById('imgProps').style.display = 'block';
    }
}

function deselectAll(e) {
    if (e && e.target.id !== 'currentSlide') return;
    selectedId = null;
    document.querySelectorAll('.slide-el').forEach(el => el.classList.remove('selected'));
    document.getElementById('propsEmpty').style.display = 'flex';
    document.getElementById('propsContent').style.display = 'none';
}

function updateEl() {
    if (!selectedId) return;
    const el = slides[currentIdx].elements.find(e => e.id === selectedId);
    if (!el) return;
    el.x = parseFloat(document.getElementById('pX').value) || 0;
    el.y = parseFloat(document.getElementById('pY').value) || 0;
    el.w = parseFloat(document.getElementById('pW').value) || 50;
    el.h = parseFloat(document.getElementById('pH').value) || 50;
    if (el.type === 'text') {
        el.text = document.getElementById('pText').value;
        el.font = document.getElementById('pFont').value;
        el.size = parseInt(document.getElementById('pSize').value) || 20;
        el.color = document.getElementById('pColor').value;
        el.bg = document.getElementById('pBg').value === '#ffffff' ? '' : document.getElementById('pBg').value;
    } else if (el.type === 'shape') {
        el.fill = document.getElementById('pFill').value;
        el.stroke = document.getElementById('pStroke').value;
        el.strokeW = parseInt(document.getElementById('pStrokeW').value) || 0;
    }
    saveAll();
    reload();
    setTimeout(() => selectEl(selectedId), 0);
}

function setTextProp(prop) {
    if (!selectedId) return;
    const el = slides[currentIdx].elements.find(e => e.id === selectedId);
    if (!el || el.type !== 'text') return;
    if (prop === 'bold') el.bold = !el.bold;
    else if (prop === 'italic') el.italic = !el.italic;
    else el.align = prop;
    saveAll();
    reload();
    setTimeout(() => selectEl(selectedId), 0);
}

function moveLayer(dir) {
    if (!selectedId) return;
    const arr = slides[currentIdx].elements;
    const idx = arr.findIndex(e => e.id === selectedId);
    if (dir === 1 && idx < arr.length - 1) { [arr[idx], arr[idx+1]] = [arr[idx+1], arr[idx]]; }
    else if (dir === -1 && idx > 0) { [arr[idx], arr[idx-1]] = [arr[idx-1], arr[idx]]; }
    saveAll(); reload(); setTimeout(() => selectEl(selectedId), 0);
    pushUndo();
}

function deleteSelected() {
    if (!selectedId) return;
    slides[currentIdx].elements = slides[currentIdx].elements.filter(e => e.id !== selectedId);
    selectedId = null;
    saveAll(); reload();
    document.getElementById('propsEmpty').style.display = 'flex';
    document.getElementById('propsContent').style.display = 'none';
    pushUndo();
}

// ============================================================
// SAVE / LOAD
// ============================================================
function saveAll() {
    localStorage.setItem('atomo_pres', JSON.stringify(slides));
    renderThumbs();
}

function reload() { loadSlide(currentIdx); }

// ============================================================
// UNDO
// ============================================================
function pushUndo() {
    undoStack.push(JSON.stringify(slides));
    if (undoStack.length > 20) undoStack.shift();
}

function undoLast() {
    if (undoStack.length === 0) { showToast('No hay acciones para deshacer'); return; }
    slides = JSON.parse(undoStack.pop());
    saveAll();
    loadSlide(currentIdx);
    showToast('↩ Deshecho');
}

// ============================================================
// DRAG & DROP
// ============================================================
function startDrag(e, id) {
    e.preventDefault();
    isDragging = true;
    const el = slides[currentIdx].elements.find(x => x.id === id);
    const rect = document.getElementById('currentSlide').getBoundingClientRect();
    dragOff.x = e.clientX - rect.left - el.x;
    dragOff.y = e.clientY - rect.top - el.y;
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', stopDrag);
}

function onDrag(e) {
    if (!isDragging || !selectedId) return;
    const rect = document.getElementById('currentSlide').getBoundingClientRect();
    const el = slides[currentIdx].elements.find(x => x.id === selectedId);
    el.x = Math.max(0, e.clientX - rect.left - dragOff.x);
    el.y = Math.max(0, e.clientY - rect.top - dragOff.y);
    const dom = document.getElementById(selectedId);
    if (dom) { dom.style.left = el.x + 'px'; dom.style.top = el.y + 'px'; }
    document.getElementById('pX').value = Math.round(el.x);
    document.getElementById('pY').value = Math.round(el.y);
}

function stopDrag() {
    if (isDragging) { saveAll(); pushUndo(); }
    isDragging = false;
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', stopDrag);
}

// Touch drag
function startTouchDrag(e, id) {
    const touch = e.touches[0];
    if (!touch) return;
    isDragging = true;
    const el = slides[currentIdx].elements.find(x => x.id === id);
    const rect = document.getElementById('currentSlide').getBoundingClientRect();
    dragOff.x = touch.clientX - rect.left - el.x;
    dragOff.y = touch.clientY - rect.top - el.y;
    document.addEventListener('touchmove', onTouchDrag, { passive: true });
    document.addEventListener('touchend', stopTouchDrag, { passive: true });
}

function onTouchDrag(e) {
    if (!isDragging || !selectedId) return;
    const touch = e.touches[0];
    if (!touch) return;
    const rect = document.getElementById('currentSlide').getBoundingClientRect();
    const el = slides[currentIdx].elements.find(x => x.id === selectedId);
    el.x = Math.max(0, touch.clientX - rect.left - dragOff.x);
    el.y = Math.max(0, touch.clientY - rect.top - dragOff.y);
    const dom = document.getElementById(selectedId);
    if (dom) { dom.style.left = el.x + 'px'; dom.style.top = el.y + 'px'; }
}

function stopTouchDrag() {
    if (isDragging) { saveAll(); pushUndo(); }
    isDragging = false;
    document.removeEventListener('touchmove', onTouchDrag);
    document.removeEventListener('touchend', stopTouchDrag);
}

// ============================================================
// RESIZE
// ============================================================
function startResize(e, id) {
    e.preventDefault();
    isResizing = true;
    const el = slides[currentIdx].elements.find(x => x.id === id);
    resizeStart = { w: el.w, h: el.h, x: e.clientX, y: e.clientY };
    document.addEventListener('mousemove', onResize);
    document.addEventListener('mouseup', stopResize);
}

function onResize(e) {
    if (!isResizing || !selectedId) return;
    const el = slides[currentIdx].elements.find(x => x.id === selectedId);
    el.w = Math.max(20, resizeStart.w + (e.clientX - resizeStart.x));
    el.h = Math.max(20, resizeStart.h + (e.clientY - resizeStart.y));
    const dom = document.getElementById(selectedId);
    if (dom) { dom.style.width = el.w + 'px'; dom.style.height = el.h + 'px'; }
    document.getElementById('pW').value = Math.round(el.w);
    document.getElementById('pH').value = Math.round(el.h);
}

function stopResize() {
    if (isResizing) { saveAll(); pushUndo(); }
    isResizing = false;
    document.removeEventListener('mousemove', onResize);
    document.removeEventListener('mouseup', stopResize);
}

// ============================================================
// DRAG & DROP FROM DESKTOP
// ============================================================
function setupDragDrop() {
    const wrapper = document.getElementById('canvasWrapper');
    wrapper.addEventListener('dragover', e => e.preventDefault());
    wrapper.addEventListener('drop', e => {
        e.preventDefault();
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            const file = e.dataTransfer.files[0];
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = evt => {
                    const rect = document.getElementById('currentSlide').getBoundingClientRect();
                    const wrapperRect = wrapper.getBoundingClientRect();
                    const scaleX = 960 / rect.width;
                    const el = {
                        id: 'e' + Date.now(), type: 'image',
                        x: (e.clientX - wrapperRect.left - 100) * scaleX,
                        y: (e.clientY - wrapperRect.top - 75) * scaleX,
                        w: 200, h: 150, src: evt.target.result
                    };
                    slides[currentIdx].elements.push(el);
                    reload();
                    selectEl(el.id);
                    pushUndo();
                };
                reader.readAsDataURL(file);
            }
        }
    });
}

// ============================================================
// FULLSCREEN PLAYER
// ============================================================
let playerIdx = 0;

function startPresentation() {
    playerIdx = currentIdx;
    document.getElementById('playerOverlay').classList.add('show');
    if (document.documentElement.requestFullscreen)
        document.documentElement.requestFullscreen().catch(() => {});
    renderPlayer();
    document.addEventListener('keydown', playerKeys);
}

function playerExit() {
    document.getElementById('playerOverlay').classList.remove('show');
    if (document.exitFullscreen) document.exitFullscreen();
    document.removeEventListener('keydown', playerKeys);
}

function playerNext() { if (playerIdx < slides.length - 1) { playerIdx++; renderPlayer(); } }
function playerPrev() { if (playerIdx > 0) { playerIdx--; renderPlayer(); } }

function playerKeys(e) {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); playerNext(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); playerPrev(); }
    if (e.key === 'Escape') playerExit();
}

function renderPlayer() {
    const container = document.getElementById('playerSlide');
    const slide = slides[playerIdx];
    const slideEl = document.createElement('div');
    slideEl.className = 'anim-' + (slide.transition || 'none');
    slideEl.style.cssText = `width:100%; height:100%; background:${slide.bg}; position:relative; overflow:hidden;`;

    slide.elements.forEach(el => {
        const d = document.createElement('div');
        const scaleX = window.innerWidth / 960;
        const scaleY = window.innerHeight / 540;
        const scale = Math.min(scaleX, scaleY);

        d.style.cssText = `position:absolute; left:${el.x * scale}px; top:${el.y * scale}px; width:${el.w * scale}px; height:${el.h * scale}px;`;
        if (el.type === 'text') {
            d.textContent = el.text;
            d.style.color = el.color;
            d.style.fontSize = (el.size * scale) + 'px';
            d.style.fontFamily = el.font || 'Space Grotesk';
            d.style.fontWeight = el.bold ? '700' : '400';
            d.style.whiteSpace = 'pre-wrap';
            d.style.display = 'flex';
            d.style.alignItems = 'center';
            if (el.align === 'center') d.style.justifyContent = 'center';
            else if (el.align === 'right') d.style.justifyContent = 'flex-end';
            if (el.bg && el.bg !== '#ffffff' && el.bg !== '') d.style.backgroundColor = el.bg;
        } else if (el.type === 'shape') {
            d.style.backgroundColor = el.fill;
            d.style.borderRadius = el.shape === 'circle' ? '50%' : '0';
            if (el.stroke && el.strokeW) d.style.border = `${el.strokeW * scale}px solid ${el.stroke}`;
        } else if (el.type === 'image') {
            const img = document.createElement('img');
            img.src = el.src;
            img.style.cssText = 'width:100%; height:100%; object-fit:cover;';
            d.appendChild(img);
        }
        slideEl.appendChild(d);
    });
    container.innerHTML = '';
    container.appendChild(slideEl);
    document.getElementById('playerCounter').textContent = `${playerIdx + 1} / ${slides.length}`;
}

// ============================================================
// EXPORT PDF
// ============================================================
function exportPDF() {
    // Build print content
    const printArea = document.getElementById('printArea');
    printArea.style.display = 'block';
    printArea.innerHTML = '';
    printArea.style.background = 'white';

    slides.forEach((slide, idx) => {
        const page = document.createElement('div');
        page.className = 'slide-print';
        page.style.cssText = `width:960px; height:540px; background:${slide.bg}; position:relative; overflow:hidden;`;
        if (idx < slides.length - 1) page.style.pageBreakAfter = 'always';

        slide.elements.forEach(el => {
            const d = document.createElement('div');
            d.style.cssText = `position:absolute; left:${el.x}px; top:${el.y}px; width:${el.w}px; height:${el.h}px;`;
            if (el.type === 'text') {
                d.textContent = el.text;
                d.style.color = el.color;
                d.style.fontSize = el.size + 'px';
                d.style.fontFamily = el.font || 'Space Grotesk';
                d.style.fontWeight = el.bold ? '700' : '400';
                d.style.whiteSpace = 'pre-wrap';
                d.style.display = 'flex';
                d.style.alignItems = 'center';
                if (el.align === 'center') d.style.justifyContent = 'center';
                else if (el.align === 'right') d.style.justifyContent = 'flex-end';
                if (el.bg && el.bg !== '#ffffff' && el.bg !== '') d.style.backgroundColor = el.bg;
            } else if (el.type === 'shape') {
                d.style.backgroundColor = el.fill;
                d.style.borderRadius = el.shape === 'circle' ? '50%' : '0';
                if (el.stroke && el.strokeW) d.style.border = `${el.strokeW}px solid ${el.stroke}`;
            } else if (el.type === 'image') {
                const img = document.createElement('img');
                img.src = el.src;
                img.style.cssText = 'width:100%; height:100%; object-fit:cover;';
                d.appendChild(img);
            }
            page.appendChild(d);
        });
        printArea.appendChild(page);
    });

    showToast('📄 Abriendo PDF…');
    window.print();
    setTimeout(() => {
        printArea.style.display = 'none';
        printArea.innerHTML = '';
    }, 1000);
}
