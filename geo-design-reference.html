<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geo — Copiloto Cognitivo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config = {
 theme: {
 extend: {
 colors: {
 g: {
 bg: '#08080a', surface: '#111114', 's2': '#1a1a1f', 's3': '#222228',
 border: '#2a2a32', 'border-l': '#35353f',
 text: '#eeeee8', muted: '#6e6e78', dim: '#44444e',
 accent: '#e8a030', 'accent-h': '#f0b848', 'accent-dim': 'rgba(232,160,48,0.12)',
 success: '#34d399', danger: '#f87171', info: '#38bdf8',
 }
 },
 fontFamily: { display: ['Space Grotesk','sans-serif'], body: ['DM Sans','sans-serif'] }
 }
 }
}
</script>
<style>
 *{margin:0;padding:0;box-sizing:border-box;}
 :root{--sidebar-w:280px;--header-h:56px;}
 html,body{height:100%;overflow:hidden;background:#08080a;color:#eeeee8;font-family:'DM Sans',sans-serif;}
 ::-webkit-scrollbar{width:5px;}
 ::-webkit-scrollbar-track{background:transparent;}
 ::-webkit-scrollbar-thumb{background:#2a2a32;border-radius:9px;}
 ::-webkit-scrollbar-thumb:hover{background:#35353f;}

 #sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:#0d0d10;
 border-right:1px solid #1a1a1f;z-index:40;display:flex;flex-direction:column;}
 #sidebar.collapsed{transform:translateX(-100%);}
 .sb-header{padding:16px;border-bottom:1px solid #1a1a1f;display:flex;align-items:center;gap:10px;}
 .sb-logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;
 background:linear-gradient(135deg,#e8a030,#f0c860);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
 .sb-new{flex:1;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;
 background:rgba(232,160,48,0.08);border:1px solid rgba(232,160,48,0.15);color:#e8a030;
 font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;}
 .sb-new:hover{background:rgba(232,160,48,0.15);}

 #mainContent{margin-left:var(--sidebar-w);height:100vh;display:flex;flex-direction:column;}
 #mainContent.full{margin-left:0;}

 .chat-header{height:var(--header-h);border-bottom:1px solid #1a1a1f;display:flex;
 align-items:center;padding:0 16px;gap:12px;flex-shrink:0;background:rgba(8,8,10,0.85);
 backdrop-filter:blur(12px);}
 .menu-btn{background:none;border:none;color:#6e6e78;font-size:18px;cursor:pointer;padding:6px;border-radius:6px;}
 .menu-btn:hover{background:#1a1a1f;color:#eeeee8;}
 .header-logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;
 background:linear-gradient(135deg,#e8a030,#f0c860);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

 #messagesContainer{flex:1;overflow-y:auto;padding:20px 0;}
 .msg-row{padding:4px 24px;}
 .msg-inner{max-width:780px;margin:0 auto;display:flex;gap:14px;align-items:flex-start;}
 .msg-avatar{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
 justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px;}
 .msg-avatar.user{background:#1a1a1f;color:#6e6e78;}
 .msg-avatar.geo{background:rgba(232,160,48,0.12);color:#e8a030;}
 .msg-body{flex:1;min-width:0;}
 .msg-content{font-size:14.5px;line-height:1.7;color:#d4d4cc;}
 .msg-content p{margin-bottom:8px;}
 .msg-content code.inline{background:#1a1a1f;padding:1px 6px;border-radius:4px;color:#e8a030;}
 .msg-content pre{background:#0d0d10;border:1px solid #1a1a1f;border-radius:8px;padding:14px;margin:10px 0;overflow-x:auto;}

 .header-tokens{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;
 background:rgba(232,160,48,0.06);border:1px solid rgba(232,160,48,0.12);font-size:12px;color:#e8a030;font-weight:500;}
 .header-mode{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;text-transform:uppercase;}
 .header-mode.economic{background:rgba(52,211,153,0.1);color:#34d399;border:1px solid rgba(52,211,153,0.2);}
 .header-mode.balanced{background:rgba(232,160,48,0.1);color:#e8a030;border:1px solid rgba(232,160,48,0.2);}

 .input-area{flex-shrink:0;padding:12px 24px 20px;border-top:1px solid #1a1a1f;}
 .input-wrapper{max-width:780px;margin:0 auto;display:flex;gap:8px;
 background:#111114;border:1px solid #2a2a32;border-radius:14px;padding:4px;}
 .input-wrapper:focus-within{border-color:#e8a030;}
 textarea{flex:1;background:transparent;border:none;padding:10px 6px;font-size:14px;
 color:#eeeee8;resize:none;outline:none;font-family:'DM Sans',sans-serif;max-height:120px;}
 .input-actions{display:flex;align-items:center;gap:4px;padding:4px;}
 .input-btn{width:34px;height:34px;border-radius:8px;background:none;border:none;
 color:#6e6e78;cursor:pointer;transition:all .15s;font-size:14px;}
 .input-btn:hover{background:#1a1a1f;color:#eeeee8;}
 .send-btn{width:38px;height:38px;border-radius:10px;background:#e8a030;border:none;
 color:#08080a;cursor:pointer;transition:all .15s;font-size:15px;}
 .send-btn:hover{background:#f0b848;}
</style>
</head>
<body>
<div id="sidebar">
 <div class="sb-header">
  <span class="sb-logo">◆ Geo</span>
  <button class="sb-new"><i class="fas fa-plus"></i> Nueva conversación</button>
 </div>
 <div class="sb-convs">
  <div class="sb-conv-group">
   <div class="sb-conv-group-label">Hoy</div>
   <div class="sb-conv-item active"><span class="conv-title">Diseño de la app Geo</span></div>
  </div>
 </div>
 <div class="sb-nav">
  <button class="sb-nav-btn"><i class="fas fa-cog"></i> Configuración</button>
  <button class="sb-nav-btn"><i class="fas fa-question-circle"></i> Ayuda</button>
  <button class="sb-nav-btn"><i class="fas fa-code"></i> API</button>
  <button class="sb-nav-btn"><i class="fas fa-palette"></i> Tema</button>
 </div>
</div>

<div id="mainContent">
 <div class="chat-header">
  <button class="menu-btn"><i class="fas fa-bars"></i></button>
  <span class="header-logo">◆ Geo</span>
  <div class="header-spacer"></div>
  <span class="header-mode balanced">EQUILIBRADO</span>
  <span class="header-tokens"><i class="fas fa-coins"></i> 1,284</span>
 </div>

 <div id="messagesContainer">
  <div class="msg-row">
   <div class="msg-inner">
    <div class="msg-avatar geo">G</div>
    <div class="msg-body">
     <div class="msg-name">Geo</div>
     <div class="msg-content">
      <p>¡Hola! Soy <strong>Geo</strong> — tu copiloto cognitivo. ¿En qué puedo ayudarte hoy?</p>
      <p>Puedo asistirte con:</p>
      <ul>
       <li>💬 Conversación y análisis</li>
       <li>📝 Notas y documentación</li>
       <li>📅 Gestión de calendario</li>
       <li>📷 Escaneo QR y OCR</li>
       <li>📄 Generación de PDFs</li>
      </ul>
     </div>
    </div>
   </div>
  </div>
 </div>

 <div class="input-area">
  <div class="input-wrapper">
   <textarea rows="1" placeholder="Envía un mensaje a Geo..."></textarea>
   <div class="input-actions">
    <button class="input-btn"><i class="fas fa-paperclip"></i></button>
    <button class="input-btn"><i class="fas fa-microphone"></i></button>
    <button class="send-btn"><i class="fas fa-arrow-up"></i></button>
   </div>
  </div>
 </div>
</div>
</body>
</html>
