<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="PDF Creator Pro — Crea cotizaciones profesionales con logo, items y total para tu PYME. Descarga o comparte por WhatsApp.">
<title>PDF Creator Pro · Átomo Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#06060c;--bg2:#0a0a14;--panel:#0f0f1e;--card2:#141428;
  --blue:#3b82f6;--purple:#8b5cf6;--cyan:#06b6d4;--green:#10b981;--gold:#f59e0b;--red:#ef4444;
  --text:#eeeef2;--text2:rgba(238,238,242,.6);--muted:#6b7280;
  --border:rgba(255,255,255,0.06);--border-blue:rgba(59,130,246,0.2);
  --grad-main:linear-gradient(135deg,#3b82f6,#8b5cf6);
  --a4-w:210mm;--a4-h:297mm;
}
*{margin:0;padding:0;box-sizing:border-box;outline:none}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

/* NAV */
nav{height:60px;background:rgba(10,10,20,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;z-index:100;flex-shrink:0}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:100%}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px}
.brand-icon{width:30px;height:30px;border-radius:7px;background:var(--grad-main);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0}
.brand-text{background:var(--grad-main);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button,.actions a{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;transition:.25s;display:flex;align-items:center;gap:6px;text-decoration:none}
.actions button:hover,.actions a:hover{background:var(--card2);border-color:var(--text2)}
.actions .primary{background:var(--grad-main);border-color:transparent;color:#fff}
.actions .primary:hover{box-shadow:0 4px 20px rgba(59,130,246,.3)}
.actions .wa{background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.25);color:#25D366}
.actions .wa:hover{background:rgba(37,211,102,.2)}
.nav-back{color:var(--text2);font-size:13px;padding:7px 12px}
.nav-back:hover{color:var(--text)}

/* LAYOUT */
.main{display:flex;flex:1;overflow:hidden}
aside{width:340px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2)}
.tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--text2);border-bottom:2px solid transparent;transition:.2s;font-family:'Space Grotesk',sans-serif}
.tab:hover{color:var(--text);background:rgba(255,255,255,.02)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);background:rgba(59,130,246,.05)}
.tab-content{display:block;flex:1;overflow-y:auto}
.tab-content.hidden{display:none}

/* CONTROL GROUP */
.ctrl{padding:16px 20px;border-bottom:1px solid var(--border)}
.ctrl:last-child{border-bottom:none}
.ctrl h3{margin:0 0 14px;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-family:'Space Grotesk',sans-serif}
.ctrl-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrl-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* TOOLS GRID */
.tools-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool-btn{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--text2);transition:.25s}
.tool-btn i{font-size:20px}
.tool-btn span{font-size:10px;text-align:center;line-height:1.2}
.tool-btn:hover{border-color:var(--border-blue);color:var(--text);background:var(--card2)}

/* FORMS */
label{display:block;font-size:11px;margin-bottom:5px;color:var(--text2);font-weight:500}
input[type="text"],input[type="number"],input[type="color"],select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-family:'Inter',sans-serif;font-size:13px;margin-bottom:8px;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--border-blue);background:rgba(59,130,246,.04)}
input[type="color"]{height:36px;padding:2px;cursor:pointer}
input.small{padding:6px 8px;font-size:12px;margin-bottom:4px}
textarea{resize:vertical;min-height:60px}

/* QUOTE ITEMS */
.quote-item-row{display:grid;grid-template-columns:1fr 60px 60px 30px;gap:4px;align-items:center;margin-bottom:6px}
.quote-item-row .qty-input{width:100%}
.quote-item-row .del-item{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:var(--red);border-radius:6px;padding:6px;cursor:pointer;font-size:12px;text-align:center;transition:.2s}
.quote-item-row .del-item:hover{background:rgba(239,68,68,.25)}
.quote-total{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;padding:8px 0;border-top:1px solid var(--border);margin-top:8px;display:flex;justify-content:space-between}
.quote-total .val{background:var(--grad-main);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* CANVAS */
.workspace{flex:1;background:#0a0a12;background-image:radial-gradient(rgba(59,130,246,.04) 1px,transparent 1px);background-size:24px 24px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:32px;position:relative}
#canvas-container{width:var(--a4-w);height:var(--a4-h);background:white;box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative;transform-origin:center top;overflow:hidden;color:#000}
.pdf-element{position:absolute;cursor:grab;user-select:none;border:1px dashed transparent;transition:border .1s}
.pdf-element:hover{border:1px dashed var(--blue)}
.pdf-element.selected{border:1px solid var(--purple);z-index:100}
.pdf-element .resize-handle{display:none;width:8px;height:8px;background:var(--purple);position:absolute;right:-4px;bottom:-4px;cursor:se-resize;border-radius:1px}
.pdf-element.selected .resize-handle{display:block}
.el-text{white-space:pre-wrap;word-break:break-word;padding:2px}
.el-image img{width:100%;height:100%;object-fit:contain;pointer-events:none}

/* QUOTE PREVIEW CANVAS */
.quote-canvas{width:100%;height:100%;position:relative;overflow:hidden;background:white}
.quote-header{display:flex;justify-content:space-between;align-items:flex-start;padding:30px 35px 20px;border-bottom:2px solid #3b82f6}
.quote-logo{max-width:120px;max-height:60px}
.quote-logo-placeholder{width:60px;height:60px;border-radius:10px;background:var(--grad-main);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.quote-header-right{text-align:right;font-size:11px;color:#6b7280;line-height:1.6}
.quote-header-right strong{font-size:13px;color:#1f2937;display:block;margin-bottom:4px}
.quote-title{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:#3b82f6;margin-bottom:2px}
.quote-body{padding:20px 35px 10px}
.quote-body .info-row{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px;color:#374151}
.quote-body .info-row .lbl{color:#6b7280}
.quote-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:12px}
.quote-table th{background:#f3f4f6;padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#6b7280;border-bottom:2px solid #3b82f6}
.quote-table td{padding:8px 10px;border-bottom:1px solid #e5e7eb;color:#374151}
.quote-table td:last-child,.quote-table th:last-child{text-align:right}
.quote-table tr.total td{border-top:2px solid #3b82f6;font-weight:700;color:#1f2937;font-size:14px;border-bottom:none;padding-top:10px}
.quote-table tr.total td:last-child{color:#3b82f6;font-size:16px}
.quote-footer{position:absolute;bottom:20px;left:35px;right:35px;border-top:1px solid #e5e7eb;padding-top:12px;display:flex;justify-content:space-between;font-size:10px;color:#9ca3af}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:2000;background:var(--panel);border:1px solid var(--border-blue);backdrop-filter:blur(12px);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);transform:translateY(100px);opacity:0;transition:all .4s cubic-bezier(.175,.885,.32,1.275)}
.toast.show{transform:translateY(0);opacity:1}
.toast i{font-size:20px}
.toast.success i{color:var(--green)}
.toast.error i{color:var(--red)}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:rgba(59,130,246,.3);border-radius:3px}

/* RESPONSIVE */
@media(max-width:900px){
  aside{width:280px}
  .workspace{padding:16px}
}
@media(max-width:768px){
  body{overflow:auto;height:auto}
  .main{flex-direction:column}
  aside{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:50vh}
  .workspace{padding:16px;min-height:60vh}
  nav{padding:0 16px}
  .actions{gap:4px}
  .actions button,.actions a{font-size:11px;padding:6px 10px}
  .brand-text{display:none}
}
@media(max-width:480px){
  .tools-grid{grid-template-columns:repeat(2,1fr)}
}
</style>

<body>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <div class="brand">
      <div class="brand-icon">📄</div>
      <span class="brand-text">PDF Creator Pro</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <a href="index.html" class="nav-back"><i class="fas fa-arrow-left"></i> <span class="brand-text">Átomo Studio</span></a>
    </div>
    <div class="actions">
      <button onclick="switchMode('design')" id="modeDesign" class="primary"><i class="fas fa-palette"></i> Diseño</button>
      <button onclick="switchMode('quote')" id="modeQuote"><i class="fas fa-file-invoice"></i> Cotización</button>

<div class="main">

    <div class="tabs">

      <div class="tab" onclick="switchTab('edit',this)">Editar</div>
      <div class="tab" onclick="switchTab('page',this)">Página</div>
    </div>

    <!-- TAB ADD -->
    <div id="tab-add" class="tab-content">
      <div class="ctrl">
        <h3>Elementos</h3>
        <div class="tools-grid">
          <div class="tool-btn" onclick="addText()"><i class="fas fa-font"></i><span>Texto</span></div>
          <div class="tool-btn" onclick="triggerImage()"><i class="fas fa-image"></i><span>Imagen</span></div>

        </div>

      <div class="ctrl">
        <h3>Cotización rápida</h3>

      </div>
    </div>

    <!-- TAB EDIT -->
    <div id="tab-edit" class="tab-content hidden">
      <div id="no-selection" style="padding:20px;text-align:center;color:var(--muted);font-size:13px">Selecciona un elemento para editar</div>
      <div id="selection-controls" style="display:none">
        <div class="ctrl">

          <div class="ctrl-grid-2">
            <div><label>X (mm)</label><input type="number" id="prop-x" oninput="updateProps()"></div>
            <div><label>Y (mm)</label><input type="number" id="prop-y" oninput="updateProps()"></div>
            <div><label>Ancho (mm)</label><input type="number" id="prop-w" oninput="updateProps()"></div>
            <div><label>Alto (mm)</label><input type="number" id="prop-h" oninput="updateProps()"></div>

          <div class="ctrl">

            <div class="ctrl-grid-2">
              <select id="prop-font" onchange="updateProps()">
                <option value="Inter">Inter</option>
                <option value="Space Grotesk">Space Grotesk</option>
                <option value="Arial">Arial</option>
                <option value="Times New Roman">Times New Roman</option>
                <option value="Courier New">Courier New</option>

            </div>
            <div class="ctrl-grid-3">
              <button onclick="toggleStyle('fontWeight','bold','normal')" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px;color:var(--text);cursor:pointer"><i class="fas fa-bold"></i></button>
              <button onclick="toggleStyle('fontStyle','italic','normal')" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px;color:var(--text);cursor:pointer"><i class="fas fa-italic"></i></button>
              <button onclick="toggleStyle('textDecoration','underline','none')" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px;color:var(--text);cursor:pointer"><i class="fas fa-underline"></i></button>

              <button onclick="setAlign('center')" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px;color:var(--text);cursor:pointer"><i class="fas fa-align-center"></i></button>
              <button onclick="setAlign('right')" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px;color:var(--text);cursor:pointer"><i class="fas fa-align-right"></i></button>

        </div>
        <div id="shape-controls" class="hidden">

  </section>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg">Listo</span></div>

<script>
// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let elements = [];
let selectedId = null;
let scale = 1;
let mode = 'design'; // 'design' | 'quote'
let isDragging = false, isResizing = false;
let dragOffset = {x:0,y:0};
let resizeStart = {w:0,h:0,x:0,y:0};
let logoDataUrl = null;
let quoteItemIdCounter = 0;

const canvas = document.getElementById('canvas-container');
const ws = document.getElementById('workspace');

// ─── INIT ───
function init(){
  loadState();
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  document.addEventListener('keydown', handleKeydown);
  renderQuoteItems();
  updateQuote();
}
init();

function resizeCanvas(){
  const w = ws.clientWidth - 64, h = ws.clientHeight - 64;
  const sx = w / 794, sy = h / 1123;
  scale = Math.min(sx, sy, 1);
  canvas.style.transform = `scale(${scale})`;
  renderAll();
}

function genId(){return 'el_'+Date.now()+'_'+Math.random().toString(36).substr(2,6)}

// ─── MODE SWITCH ───
function switchMode(newMode){
  mode = newMode;
  document.getElementById('modeDesign').className = mode==='design'?'primary':'';
  document.getElementById('modeQuote').className = mode==='quote'?'primary':'';
  renderAll();
}

// ─── TAB SWITCH ───
function switchTab(name, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.add('hidden'));
  document.getElementById('tab-'+name).classList.remove('hidden');
}

// ─── RENDER ───
function renderAll(){
  if(mode==='quote'){
    renderQuoteCanvas();
    return;
  }
  canvas.innerHTML = '';
  elements.forEach(el => {
    const div = createElement(el);
    if(el.id===selectedId) div.classList.add('selected');
    canvas.appendChild(div);
  });
  const pg = JSON.parse(localStorage.getItem('pdf_page')||'{"bg":"#ffffff"}');
  canvas.style.backgroundColor = pg.bg;
  document.getElementById('page-bg').value = pg.bg;
}

function createElement(el){
  const div = document.createElement('div');
  div.className = `pdf-element ${el.type==='text'?'el-text':'el-image'}`;
  div.id = el.id;
  div.style.left = el.x+'mm'; div.style.top = el.y+'mm';
  div.style.width = el.w+'mm'; div.style.height = el.h+'mm';
  if(el.type==='text'){
    div.innerText = el.content;
    div.style.fontFamily = el.fontFamily||'Inter';
    div.style.fontSize = (el.fontSize||12)+'pt';
    div.style.color = el.color||'#000';
    div.style.textAlign = el.textAlign||'left';
    div.style.fontWeight = el.fontWeight||'normal';
    div.style.fontStyle = el.fontStyle||'normal';
    div.style.textDecoration = el.textDecoration||'none';
    div.style.backgroundColor = el.bg||'transparent';
    div.style.display = 'flex';
    div.style.alignItems = 'center';
    div.style.justifyContent = el.textAlign==='center'?'center':el.textAlign==='right'?'flex-end':'flex-start';
  } else if(el.type==='image'){
    const img = document.createElement('img');
    img.src = el.src;
    img.style.width='100%'; img.style.height='100%'; img.style.objectFit='contain';
    div.appendChild(img);
  } else {
    div.style.backgroundColor = el.fill||'transparent';
    div.style.border = `${el.strokeWidth||0}px solid ${el.stroke||'#000'}`;
  }
  const handle = document.createElement('div');
  handle.className = 'resize-handle';
  div.appendChild(handle);
  div.addEventListener('mousedown', e => startDrag(e, el.id));
  handle.addEventListener('mousedown', e => startResize(e, el.id));
  return div;
}

function numToWords(n){
  if(n===0) return 'cero';
  const units=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];
  const teens=['diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve'];
  const tens=['','','veinte','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const hundreds=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  function convert(n){
    if(n<10) return units[n];
    if(n<20) return teens[n-10];
    if(n<30) return n===20?'veinte':'veinti'+units[n%10];
    if(n<100) return tens[Math.floor(n/10)]+(n%10?' y '+units[n%10]:'');
    if(n<1000) return hundreds[Math.floor(n/100)]+(n%100?' '+convert(n%100):'');
    if(n<1e6) return convert(Math.floor(n/1000))+' mil'+(n%1000?' '+convert(n%1000):'');
    return '';
  }
  return convert(n);
}

// ─── QUOTE ITEMS ───
function getQuoteItems(){
  const items = [];
  document.querySelectorAll('.quote-item').forEach(row=>{
    const name = row.querySelector('.qi-name').value;
    const qty = parseInt(row.querySelector('.qi-qty').value)||1;
    const price = parseInt(row.querySelector('.qi-price').value)||0;
    if(name) items.push({name,qty,price});
  });
  return items;
}

function renderQuoteItems(){
  const stored = localStorage.getItem('pdf_quote_items');

function handleImage(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=100,h=(img.height/img.width)*100;
      if(h>100){h=100;w=(img.width/img.height)*100;}
      const el={id:genId(),type:'image',x:20,y:20,w,h,src:e.target.result};
      elements.push(el); saveState(); renderAll(); selectElement(el.id); showToast('Imagen agregada');

  };
  reader.readAsDataURL(file); input.value='';
}

  document.getElementById('prop-x').value=el.x.toFixed(1);
  document.getElementById('prop-y').value=el.y.toFixed(1);

// ─── DRAG ───
function startDrag(e,id){
  if(e.target.classList.contains('resize-handle')) return;
  e.stopPropagation(); selectElement(id); isDragging=true;
  const el=elements.find(x=>x.id===id);
  const rect=canvas.getBoundingClientRect();
  dragOffset.x=(e.clientX-rect.left)/scale-mmToPx(el.x);
  dragOffset.y=(e.clientY-rect.top)/scale-mmToPx(el.y);
  document.addEventListener('mousemove',onDrag);
  document.addEventListener('mouseup',stopDrag);
}
function onDrag(e){
  if(!isDragging||!selectedId) return;
  const el=elements.find(x=>x.id===selectedId);
  const rect=canvas.getBoundingClientRect();
  el.x=parseFloat(pxToMm((e.clientX-rect.left)/scale-dragOffset.x).toFixed(1));
  el.y=parseFloat(pxToMm((e.clientY-rect.top)/scale-dragOffset.y).toFixed(1));
  const dom=document.getElementById(selectedId);
  if(dom){dom.style.left=el.x+'mm';dom.style.top=el.y+'mm';}
  document.getElementById('prop-x').value=el.x.toFixed(1);
  document.getElementById('prop-y').value=el.y.toFixed(1);
}
function stopDrag(){if(isDragging){isDragging=false;saveState();} document.removeEventListener('mousemove',onDrag); document.removeEventListener('mouseup',stopDrag);}

function startResize(e,id){
  e.stopPropagation(); isResizing=true; selectElement(id);
  const el=elements.find(x=>x.id===id);
  resizeStart={w:el.w,h:el.h,x:e.clientX,y:e.clientY};
  document.addEventListener('mousemove',onResize);
  document.addEventListener('mouseup',stopResize);
}
function onResize(e){
  if(!isResizing||!selectedId) return;
  const el=elements.find(x=>x.id===selectedId);
  el.w=Math.max(5,parseFloat(pxToMm((resizeStart.w*3.7795+(e.clientX-resizeStart.x)/scale)).toFixed(1)));
  el.h=Math.max(5,parseFloat(pxToMm((resizeStart.h*3.7795+(e.clientY-resizeStart.y)/scale)).toFixed(1)));
  const dom=document.getElementById(selectedId);
  if(dom){dom.style.width=el.w+'mm';dom.style.height=el.h+'mm';}
  document.getElementById('prop-w').value=el.w.toFixed(1);
  document.getElementById('prop-h').value=el.h.toFixed(1);
}
function stopResize(){if(isResizing){isResizing=false;saveState();} document.removeEventListener('mousemove',onResize); document.removeEventListener('mouseup',stopResize);}

function mmToPx(mm){return mm*3.7795}
function pxToMm(px){return px/3.7795}
