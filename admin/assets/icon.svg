<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F0D2E"/>
    </linearGradient>
    <linearGradient id="acc" x1="8" y1="8" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="96" height="96" rx="20" fill="url(#bg)"/>

  <!-- Globe/Site lines -->
  <rect x="20" y="28" width="56" height="40" rx="6" stroke="url(#acc)" stroke-width="2.5" fill="none"/>

  <!-- Roof -->
  <path d="M16 34L48 12L80 34" stroke="url(#acc)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Search beam -->
  <circle cx="53" cy="52" r="8" stroke="url(#acc)" stroke-width="2" fill="none"/>
  <line x1="59" y1="58" x2="63" y2="62" stroke="url(#acc)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Page lines -->
  <line x1="34" y1="40" x2="44" y2="40" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="34" y1="46" x2="44" y2="46" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="34" y1="52" x2="40" y2="52" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
